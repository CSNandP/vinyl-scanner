<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=800, height=480, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <title>Now Spinning</title>

  <style>
    :root{
      --bg:#ffffff; --fg:#111111;
      --muted: rgba(0,0,0,0.70);
      --panel: rgba(255,255,255,0.86);
      --border: rgba(0,0,0,0.14);

      --wash: rgba(0,0,0,0.00);
      --wash2: rgba(0,0,0,0.00);
      --title: #111111;

      --shadow: rgba(0,0,0,0.16);
      --shadow2: rgba(0,0,0,0.08);
    }

    body{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin:0;
      padding:12px 12px 10px 12px;
      color: var(--fg);
      background:
        radial-gradient(520px 520px at 210px 210px, var(--wash), rgba(0,0,0,0) 70%),
        radial-gradient(620px 620px at 240px 240px, var(--wash2), rgba(0,0,0,0) 76%),
        linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.02) 100%),
        var(--bg);
      transition: background 0.7s ease, color 0.7s ease;
      overflow: hidden;
    }

    /* ---------- SPLASH ---------- */
    .splash {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.7s ease;
      overflow: hidden;
    }
    .splash.hidden { opacity: 0; pointer-events: none; }

    .splash::before{
      content:"";
      position:absolute;
      inset:-40px;
      background:
        repeating-radial-gradient(circle at 50% 52%,
          rgba(255,255,255,0.075) 0px,
          rgba(255,255,255,0.075) 1px,
          rgba(255,255,255,0.00) 3px,
          rgba(255,255,255,0.00) 8px),
        radial-gradient(700px 520px at 52% 44%,
          rgba(255,255,255,0.08) 0%,
          rgba(255,255,255,0.00) 60%);
      opacity: 0.22;
      filter: blur(0.2px);
      transform-origin: 50% 52%;
      animation: grooveRotate 20s linear infinite;
    }

    .splash::after{
      content:"";
      position:absolute;
      inset:-40px;
      background:
        linear-gradient(110deg,
          rgba(255,255,255,0.00) 0%,
          rgba(255,255,255,0.06) 45%,
          rgba(255,255,255,0.00) 60%);
      opacity: 0.20;
      transform: translateX(-40%);
      animation: shimmer 6.8s ease-in-out infinite;
      mix-blend-mode: screen;
      pointer-events: none;
    }

    @keyframes grooveRotate { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    @keyframes shimmer {
      0%,100% { transform: translateX(-55%) translateY(0); opacity: 0.12; }
      50%     { transform: translateX(25%) translateY(-6px); opacity: 0.22; }
    }

    .splash-inner{
      position: relative;
      z-index: 1;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding: 0 16px;
      text-align:center;
    }

    .splash-title-wrap{
      height: 62px;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    .splash-title {
      font-size: 52px;
      letter-spacing: 1.2px;
      color: rgba(255,255,255,0.95);
      text-transform: uppercase;
      margin: 0;
      line-height: 1.0;
      animation: breathe 2.8s ease-in-out infinite;
      will-change: transform, opacity;
      transform: translateY(0);
      opacity: 1;
      transition: opacity 0.55s ease, transform 0.55s ease;
      white-space: nowrap;
      user-select: none;
    }

    .splash-title.out { opacity: 0; transform: translateY(-10px); }
    .splash-title.in  { opacity: 1; transform: translateY(0); }

    .splash-title.code {
      letter-spacing: 2.2px;
      font-variant-numeric: tabular-nums;
      text-transform: none;
      animation: none;
    }

    .splash-sub {
      margin-top: 18px;
      font-size: 13px;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      opacity: 0.9;
      user-select: none;
    }

    @keyframes breathe {
      0%, 100% { transform: translateY(0); opacity: 0.92; }
      50%      { transform: translateY(-2px); opacity: 1.00; }
    }

    /* ---------- LAYOUT ---------- */
    .frame{
      display:flex;
      flex-direction:column;
      height: calc(480px - 22px);
    }

    .topline{
      height: 16px;
      display:flex;
      align-items:center;
      justify-content:flex-end;
      padding-right: 2px;
    }

    #status{
      font-size: 11.5px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0.65;
      user-select:none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 55vw;
    }

    .content{
      display:flex;
      gap:12px;
      align-items:flex-start;
      flex: 1 1 auto;
      min-height: 0;
    }

    /* ---------- RECORD PLAYER ---------- */
    .platter{
      position:relative;
      width:392px;
      height:392px;
      border-radius:50%;
      flex: 0 0 auto;
    }

    .platter::before{
      content:"";
      position:absolute;
      inset:-12px;
      border-radius:50%;
      background:
        radial-gradient(circle,
          rgba(0,0,0,0.16) 0%,
          rgba(0,0,0,0.10) 38%,
          rgba(0,0,0,0.04) 58%,
          rgba(0,0,0,0.00) 74%);
      filter: blur(9px);
      z-index:0;
      opacity: 0.95;
      transition: opacity 0.7s ease;
    }

    #cover{
      position:relative;
      z-index:1;
      width:392px;
      height:392px;
      border-radius:50%;
      object-fit:cover;
      background:#eee;
      box-shadow: 0 12px 30px var(--shadow);
      animation: spin 28s linear infinite;
      animation-play-state: paused;
      opacity: 0;
      transform: translateY(6px) scale(0.985);
      transition: opacity 0.35s ease, transform 0.35s ease;
      will-change: transform, opacity;
    }

    #cover.show{ opacity: 1; transform: translateY(0) scale(1); }

    .label-ring{
      position:absolute;
      inset:0;
      margin:auto;
      width: 96px;
      height: 96px;
      border-radius:50%;
      background:
        radial-gradient(circle,
          rgba(255,255,255,0.00) 0%,
          rgba(255,255,255,0.00) 58%,
          rgba(255,255,255,0.28) 60%,
          rgba(255,255,255,0.00) 66%);
      pointer-events:none;
      z-index:2;
      opacity: 0.9;
    }

    @keyframes spin{ from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

    /* ---------- INFO PANEL ---------- */
    .right{
      width:372px;
      min-width:0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius:12px;
      padding:10px;
      box-shadow: 0 10px 26px var(--shadow2);
      transition: background 0.7s ease, border-color 0.7s ease, box-shadow 0.7s ease;
      display:flex;
      flex-direction:column;
      min-height: 392px;
      height: 392px;
      box-sizing: border-box;
    }

    .fade{ opacity:0; transform: translateY(6px); will-change: transform, opacity; }
    .fade.show{ opacity:1; transform: translateY(0); transition: opacity 0.35s ease, transform 0.35s ease; }

    #title{
      font-size: 23px;
      font-weight: 860;
      line-height: 1.08;
      letter-spacing: -0.3px;
      color: var(--title);
      transition: color 0.7s ease;
      margin-top: 1px;
    }

    #artist{
      font-size: 15px;
      margin-top: 7px;
      font-weight: 850;
      opacity: 0.96;
      letter-spacing: -0.1px;
    }

    .meta{ font-size: 12.5px; margin-top: 6px; color: var(--muted); }

    /* ---------- FACTS ---------- */
    .facts{
      margin-top: 10px;
      display:flex;
      flex-direction:column;
      min-height:0;
      flex: 1 1 auto;
    }

    .facts h2{
      font-size: 12.5px;
      margin: 0 0 6px 0;
      font-weight: 900;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0.9;
    }

    .facts-box{
      border: 1px solid var(--border);
      border-radius:12px;
      padding: 10px 10px;
      background: rgba(255,255,255,0.50);
      transition: background 0.7s ease, border-color 0.7s ease;
      flex: 1 1 auto;
      min-height: 0;
      overflow: hidden; /* facts should fit; no scrolling needed */
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
      gap: 8px;
    }

    .fact{
      display:flex;
      gap: 8px;
      align-items:flex-start;
      font-size: 13px;
      line-height: 1.18;
    }

    .dot{
      width: 7px;
      height: 7px;
      border-radius: 99px;
      margin-top: 5px;
      background: rgba(0,0,0,0.22);
      flex: 0 0 auto;
    }

    .fact span{
      opacity: 0.92;
    }

    .fact .muted{
      opacity: 0.70;
    }

    /* ---------- FOOTER with Back button ---------- */
    .footer{
      height: 22px;
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      font-size: 12px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0.78;
      user-select:none;
      padding: 0 2px;
    }

    .footer .center{
      flex: 1 1 auto;
      text-align:center;
      pointer-events:none;
    }

    .back{
      font-size: 11.5px;
      letter-spacing: 1.1px;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0.85;
      background: transparent;
      border: 1px solid rgba(0,0,0,0.0);
      padding: 2px 8px;
      border-radius: 999px;
      cursor: pointer;
      transition: opacity 0.2s ease, border-color 0.25s ease, background 0.25s ease;
    }

    .back:hover{
      opacity: 1;
      border-color: rgba(0,0,0,0.14);
      background: rgba(0,0,0,0.03);
    }
  </style>
</head>

<body>
  <!-- Splash overlay -->
  <div id="splash" class="splash">
    <div class="splash-inner">
      <div class="splash-title-wrap">
        <div id="splashTitle" class="splash-title in">Scan Record</div>
      </div>
      <div id="splashSub" class="splash-sub">Ready</div>
    </div>
  </div>

  <div class="frame">
    <div class="topline">
      <div id="status">Ready for scan…</div>
    </div>

    <div class="content">
      <div class="platter">
        <img id="cover" alt="Cover"/>
        <div class="label-ring"></div>
      </div>

      <div class="right">
        <div id="title" class="fade"></div>
        <div id="artist" class="fade"></div>
        <div id="year" class="meta fade"></div>
        <div id="label" class="meta fade"></div>

        <div class="facts">
          <h2 class="fade">Album facts</h2>
          <div id="facts" class="facts-box fade">
            <div class="fact"><div class="dot"></div><span class="muted">Scan a record to show facts</span></div>
          </div>
        </div>
      </div>
    </div>

    <div class="footer">
      <button id="backBtn" class="back" type="button">Back to splash</button>
      <div class="center">Now Spinning</div>
      <div style="width:120px;"></div>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);

  const GAP_RESET_MS = 250;
  const SUBMIT_AFTER_MS = 180;

  let buffer = "";
  let lastKeyTime = 0;
  let submitTimer = null;

  // --- Splash ---
  const fontCycle = [
    'system-ui, -apple-system, Segoe UI, Roboto, sans-serif',
    '"Trebuchet MS", system-ui, sans-serif',
    '"Arial Black", Arial, system-ui, sans-serif',
    'Georgia, "Times New Roman", serif',
    '"Palatino Linotype", Palatino, serif',
    '"Courier New", Courier, monospace',
    '"Gill Sans", "Segoe UI", system-ui, sans-serif',
    'Impact, "Arial Black", system-ui, sans-serif'
  ];

  let fontIdx = 0;
  let fontTimer = null;
  let fontBusy = false;
  let splashMode = "idle"; // idle | code | lookup

  const getSplash = () => document.getElementById("splash");
  const getSplashTitle = () => document.getElementById("splashTitle");
  const getSplashSub = () => document.getElementById("splashSub");

  function safeStartSplashIdleFonts(){
    const st = getSplashTitle();
    if (!st) return;
    splashMode = "idle";
    st.classList.remove("code");
    st.style.fontFamily = fontCycle[0];
    st.textContent = "Scan Record";
    const ss = getSplashSub();
    if (ss) ss.textContent = "Ready";

    if (fontTimer) clearInterval(fontTimer);
    fontTimer = setInterval(async () => {
      const st2 = getSplashTitle();
      if (!st2) return;
      if (fontBusy) return;
      if (splashMode !== "idle") return;
      fontBusy = true;

      st2.classList.add("out");
      st2.classList.remove("in");
      await new Promise(r => setTimeout(r, 320));

      fontIdx = (fontIdx + 1) % fontCycle.length;
      st2.style.fontFamily = fontCycle[fontIdx];

      st2.classList.remove("out");
      st2.classList.add("in");
      await new Promise(r => setTimeout(r, 320));

      fontBusy = false;
    }, 1400);
  }

  function safeSetSplashBarcodeLive(digits){
    const st = getSplashTitle();
    if (!st) return;
    splashMode = "code";
    st.classList.add("code");
    st.style.fontFamily = '"Courier New", Courier, monospace';
    st.textContent = digits || "";
    const ss = getSplashSub();
    if (ss) ss.textContent = "Scanning…";
  }

  function safeSetSplashLookingUp(){
    const st = getSplashTitle();
    if (!st) return;
    splashMode = "lookup";
    st.classList.remove("code");
    st.style.fontFamily = 'system-ui, -apple-system, Segoe UI, Roboto, sans-serif';
    st.textContent = "Looking up…";
    const ss = getSplashSub();
    if (ss) ss.textContent = "Please wait";
  }

  function safeHideSplashOnce(){
    const sp = getSplash();
    if (!sp) return;
    if (sessionStorage.getItem("started") === "1") return;

    sessionStorage.setItem("started", "1");
    sp.classList.add("hidden");
    setTimeout(() => sp.remove(), 900);

    if (fontTimer) clearInterval(fontTimer);
  }

  function showSplashAgain(){
    sessionStorage.removeItem("started");

    if (!document.getElementById("splash")) {
      const div = document.createElement("div");
      div.id = "splash";
      div.className = "splash";
      div.innerHTML = `
        <div class="splash-inner">
          <div class="splash-title-wrap">
            <div id="splashTitle" class="splash-title in">Scan Record</div>
          </div>
          <div id="splashSub" class="splash-sub">Ready</div>
        </div>`;
      document.body.prepend(div);
    }

    document.getElementById("splash").classList.remove("hidden");
    safeStartSplashIdleFonts();
  }

  // initial splash state
  if (sessionStorage.getItem("started") === "1") {
    const sp = getSplash();
    if (sp) sp.remove();
  } else {
    safeStartSplashIdleFonts();
  }

  function setStatus(text){
    const el = $("status");
    if (el) el.textContent = text;
  }

  function clearReveal() {
    const cover = $("cover");
    cover.classList.remove("show");
    cover.style.animationPlayState = "paused";

    const fades = document.querySelectorAll(".fade");
    for (const el of fades) el.classList.remove("show");
  }

  function clearDisplay(keepStatus) {
    $("title").textContent = "";
    $("artist").textContent = "";
    $("year").textContent = "";
    $("label").textContent = "";
    $("cover").src = "";
    $("facts").innerHTML = `<div class="fact"><div class="dot"></div><span class="muted">Scan a record to show facts</span></div>`;
    if (!keepStatus) setStatus("Ready for scan…");

    document.documentElement.style.setProperty("--wash", "rgba(0,0,0,0)");
    document.documentElement.style.setProperty("--wash2", "rgba(0,0,0,0)");
    document.documentElement.style.setProperty("--title", "var(--fg)");
  }

  function stageReveal() {
    $("cover").classList.add("show");

    const steps = [
      { sel: "#title", ms: 90 },
      { sel: "#artist", ms: 140 },
      { sel: "#year", ms: 190 },
      { sel: "#label", ms: 230 },
      { sel: ".facts h2", ms: 270 },
      { sel: "#facts", ms: 310 }
    ];

    for (const s of steps) {
      setTimeout(() => {
        const el = document.querySelector(s.sel);
        if (el) el.classList.add("show");
      }, s.ms);
    }
  }

  function renderFactsFromApiOrFallback(data){
    // Preferred: API provides facts: ["Released in 1977", "Genre: Punk", ...]
    let facts = Array.isArray(data.facts) ? data.facts.filter(Boolean) : [];

    // Fallback: generate a few from known fields so it never looks empty
    if (!facts.length) {
      if (data.year) facts.push(`Released: ${data.year}`);
      if (Array.isArray(data.labels) && data.labels[0]) facts.push(`Label: ${data.labels[0]}`);
      if (data.country) facts.push(`Country: ${data.country}`);
      if (Array.isArray(data.genres) && data.genres.length) facts.push(`Genre: ${data.genres.slice(0,2).join(" • ")}`);
      if (Array.isArray(data.styles) && data.styles.length) facts.push(`Style: ${data.styles.slice(0,2).join(" • ")}`);
      if (data.community && data.community.rating && data.community.count) {
        facts.push(`Discogs rating: ${data.community.rating} (${data.community.count} ratings)`);
      }
      if (data.stats && (data.stats.have || data.stats.want)) {
        const have = data.stats.have ? `${data.stats.have} have` : null;
        const want = data.stats.want ? `${data.stats.want} want` : null;
        facts.push([have, want].filter(Boolean).join(" • "));
      }
      if (!facts.length) facts.push("No extra facts available yet.");
    }

    // Keep it tidy for the 7" screen
    facts = facts.slice(0, 6);

    $("facts").innerHTML = facts.map(t =>
      `<div class="fact"><div class="dot"></div><span>${escapeHtml(t)}</span></div>`
    ).join("");
  }

  function escapeHtml(str){
    return String(str)
      .replaceAll("&","&amp;")
      .replaceAll("<","&lt;")
      .replaceAll(">","&gt;")
      .replaceAll('"',"&quot;")
      .replaceAll("'","&#039;");
  }

  function applyThemeFromCover(img) {
    try {
      const c = document.createElement("canvas");
      const ctx = c.getContext("2d", { willReadFrequently: true });
      c.width = c.height = 56;
      ctx.drawImage(img, 0, 0, 56, 56);
      const d = ctx.getImageData(0, 0, 56, 56).data;

      let r=0,g=0,b=0,l=0,n=0;

      for (let i=0;i<d.length;i+=4) {
        if (d[i+3] < 200) continue;
        const max=Math.max(d[i],d[i+1],d[i+2]);
        const min=Math.min(d[i],d[i+1],d[i+2]);
        if (max>245 && min>245) continue;
        if (max<18 && min<18) continue;

        r+=d[i]; g+=d[i+1]; b+=d[i+2];
        l+=0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2];
        n++;
      }
      if (!n) return;

      r=Math.round(r/n); g=Math.round(g/n); b=Math.round(b/n);

      const avg=(r+g+b)/3, boost=1.22;
      r=Math.min(255, Math.max(0, Math.round(avg+(r-avg)*boost)));
      g=Math.min(255, Math.max(0, Math.round(avg+(g-avg)*boost)));
      b=Math.min(255, Math.max(0, Math.round(avg+(b-avg)*boost)));

      document.documentElement.style.setProperty("--title", `rgb(${r},${g},${b})`);
      document.documentElement.style.setProperty("--wash",  `rgba(${r},${g},${b},0.18)`);
      document.documentElement.style.setProperty("--wash2", `rgba(${r},${g},${b},0.10)`);

      const dark = (l/n) < 110;

      document.documentElement.style.setProperty("--bg", dark ? "#0f1115" : "#ffffff");
      document.documentElement.style.setProperty("--fg", dark ? "#f0f2f5" : "#111111");
      document.documentElement.style.setProperty("--panel", dark ? "rgba(20,22,28,0.82)" : "rgba(255,255,255,0.86)");
      document.documentElement.style.setProperty("--border", dark ? "rgba(240,242,245,0.14)" : "rgba(0,0,0,0.14)");
      document.documentElement.style.setProperty("--muted", dark ? "rgba(240,242,245,0.72)" : "rgba(0,0,0,0.70)");
      document.documentElement.style.setProperty("--shadow", dark ? "rgba(0,0,0,0.44)" : "rgba(0,0,0,0.16)");
      document.documentElement.style.setProperty("--shadow2", dark ? "rgba(0,0,0,0.26)" : "rgba(0,0,0,0.08)");
    } catch {}
  }

  async function lookup(code) {
    if (!code || code.length < 10) return;

    safeSetSplashLookingUp();
    safeHideSplashOnce();

    setStatus("Looking up…");
    clearReveal();
    clearDisplay(true);

    try {
      const res = await fetch(`/api/lookup?barcode=${code}`);
      const data = await res.json();
      if (!res.ok) throw new Error("Lookup failed");

      $("title").textContent = data.title || "";
      $("artist").textContent = (data.artists||[]).join(" • ");
      $("year").textContent = data.year ? `Year: ${data.year}` : "";
      $("label").textContent = (data.labels||[]).length ? `Label: ${data.labels[0]}` : "";

      renderFactsFromApiOrFallback(data);

      if (data.cover) {
        const img = $("cover");
        img.onload = () => {
          applyThemeFromCover(img);
          img.style.animationPlayState = "running";
          stageReveal();
        };
        img.src = data.cover;
      } else {
        stageReveal();
      }

      setStatus(data.cached ? "Loaded (cached) — ready" : "Loaded — ready");
    } catch (e) {
      setStatus("Error — ready for scan…");
    }
  }

  function scheduleSubmit() {
    clearTimeout(submitTimer);
    submitTimer = setTimeout(() => {
      const digits = buffer.replace(/\D/g,"");
      buffer = "";
      if (digits.length >= 10) lookup(digits);
      else {
        if (sessionStorage.getItem("started") !== "1") safeStartSplashIdleFonts();
      }
    }, SUBMIT_AFTER_MS);
  }

  window.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;

    const now = Date.now();
    if (now - lastKeyTime > GAP_RESET_MS) buffer = "";
    lastKeyTime = now;

    if (e.key === "Enter") {
      const digits = buffer.replace(/\D/g,"");
      buffer = "";
      if (digits.length >= 10) lookup(digits);
      else if (sessionStorage.getItem("started") !== "1") safeStartSplashIdleFonts();
      return;
    }

    if (/[0-9]/.test(e.key)) {
      if (sessionStorage.getItem("started") !== "1") {
        const digits = (buffer + e.key).replace(/\D/g,"");
        safeSetSplashBarcodeLive(digits);
      }
      buffer += e.key;
      scheduleSubmit();
    }
  }, true);

  $("backBtn").addEventListener("click", () => {
    if (submitTimer) clearTimeout(submitTimer);
    buffer = "";

    clearReveal();
    clearDisplay(false);
    setStatus("Ready for scan…");

    const cover = $("cover");
    cover.style.animationPlayState = "paused";
    cover.classList.remove("show");

    showSplashAgain();
    safeStartSplashIdleFonts();
  });

  // initial state
  clearReveal();
  clearDisplay(false);
</script>

</body>
</html>
