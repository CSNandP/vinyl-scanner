<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=800, height=480, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <title>Now Spinning</title>

  <style>
    :root{
      --bg:#ffffff; --fg:#111111;
      --muted: rgba(0,0,0,0.70);
      --panel: rgba(255,255,255,0.86);
      --border: rgba(0,0,0,0.14);

      --wash: rgba(0,0,0,0.00);
      --wash2: rgba(0,0,0,0.00);
      --title: #111111;

      --shadow: rgba(0,0,0,0.16);
      --shadow2: rgba(0,0,0,0.08);
    }

    body{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin:0;
      padding:12px 12px 10px 12px;
      color: var(--fg);
      background:
        radial-gradient(520px 520px at 210px 210px, var(--wash), rgba(0,0,0,0) 70%),
        radial-gradient(620px 620px at 240px 240px, var(--wash2), rgba(0,0,0,0) 76%),
        linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.02) 100%),
        var(--bg);
      transition: background 0.7s ease, color 0.7s ease;
      overflow: hidden;
    }

    .frame{
      display:flex;
      flex-direction:column;
      height: calc(480px - 22px);
    }

    .topline{
      height: 16px;
      display:flex;
      align-items:center;
      justify-content:flex-end;
      padding-right: 2px;
    }

    #status{
      font-size: 11.5px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0.65;
      user-select:none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 55vw;
    }

    .content{
      display:flex;
      gap:12px;
      align-items:flex-start;
      flex: 1 1 auto;
      min-height: 0;
    }

    /* ---------- RECORD PLAYER ---------- */
    .platter{
      position:relative;
      width:392px;
      height:392px;
      border-radius:50%;
      flex: 0 0 auto;
    }

    .platter::before{
      content:"";
      position:absolute;
      inset:-12px;
      border-radius:50%;
      background:
        radial-gradient(circle,
          rgba(0,0,0,0.16) 0%,
          rgba(0,0,0,0.10) 38%,
          rgba(0,0,0,0.04) 58%,
          rgba(0,0,0,0.00) 74%);
      filter: blur(9px);
      z-index:0;
      opacity: 0.95;
      transition: opacity 0.7s ease;
    }

    #cover{
      position:relative;
      z-index:1;
      width:392px;
      height:392px;
      border-radius:50%;
      object-fit:cover;
      background:#eee;
      box-shadow: 0 12px 30px var(--shadow);
      animation: spin 28s linear infinite;
      animation-play-state: paused;
      opacity: 0;
      transform: translateY(6px) scale(0.985);
      transition: opacity 0.35s ease, transform 0.35s ease;
      will-change: transform, opacity;
    }

    #cover.show{
      opacity: 1;
      transform: translateY(0) scale(1);
    }

    .label-ring{
      position:absolute;
      inset:0;
      margin:auto;
      width: 96px;
      height: 96px;
      border-radius:50%;
      background:
        radial-gradient(circle,
          rgba(255,255,255,0.00) 0%,
          rgba(255,255,255,0.00) 58%,
          rgba(255,255,255,0.28) 60%,
          rgba(255,255,255,0.00) 66%);
      pointer-events:none;
      z-index:2;
      opacity: 0.9;
    }

    @keyframes spin{
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* ---------- INFO PANEL ---------- */
    .right{
      width:372px;
      min-width:0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius:12px;
      padding:10px;
      box-shadow: 0 10px 26px var(--shadow2);
      transition: background 0.7s ease, border-color 0.7s ease, box-shadow 0.7s ease;
      display:flex;
      flex-direction:column;
      min-height: 392px;
      height: 392px;
      box-sizing: border-box;
    }

    /* Micro-animations: staged reveal */
    .fade{
      opacity:0;
      transform: translateY(6px);
      will-change: transform, opacity;
    }
    .fade.show{
      opacity:1;
      transform: translateY(0);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }

    #title{
      font-size: 23px;
      font-weight: 860;
      line-height: 1.08;
      letter-spacing: -0.3px;
      color: var(--title);
      transition: color 0.7s ease;
      margin-top: 1px;
    }

    #artist{
      font-size: 15px;
      margin-top: 7px;
      font-weight: 850;
      opacity: 0.96;
      letter-spacing: -0.1px;
    }

    .meta{
      font-size: 12.5px;
      margin-top: 6px;
      color: var(--muted);
    }

    .tracks{
      margin-top: 10px;
      display:flex;
      flex-direction:column;
      min-height:0;
      flex: 1 1 auto;
    }

    .tracks h2{
      font-size: 12.5px;
      margin: 0 0 6px 0;
      font-weight: 900;
      letter-spacing: 0.7px;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0.9;
    }

    .tracks-box{
      border: 1px solid var(--border);
      border-radius:12px;
      padding: 8px 10px;
      background: rgba(255,255,255,0.50);
      transition: background 0.7s ease, border-color 0.7s ease;

      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
    }

    .side{
      margin: 8px 0 6px 0;
      font-size: 11.5px;
      font-weight: 950;
      letter-spacing: 0.9px;
      text-transform: uppercase;
      opacity: 0.62;
    }

    /* ✅ Two-column track layout */
    .cols{
      column-count: 2;
      column-gap: 16px;
      column-fill: auto;
    }

    .track{
      break-inside: avoid;
      -webkit-column-break-inside: avoid;
      page-break-inside: avoid;
      font-size: 12.8px;
      margin: 0 0 6px 0;
      line-height: 1.12;
      display: block;
    }

    .pos{
      font-weight: 950;
      margin-right: 6px;
      opacity: 0.95;
    }

    .dur{
      opacity: 0.65;
      margin-left: 6px;
      font-size: 11.8px;
    }

    .footer{
      height: 22px;
      display:flex;
      align-items:flex-end;
      justify-content:center;
      font-size: 12px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0.75;
      user-select:none;
    }
  </style>
</head>

<body>
  <div class="frame">
    <div class="topline">
      <div id="status">Ready for scan…</div>
    </div>

    <div class="content">
      <div class="platter">
        <img id="cover" alt="Cover"/>
        <div class="label-ring"></div>
      </div>

      <div class="right">
        <div id="title" class="fade"></div>
        <div id="artist" class="fade"></div>
        <div id="year" class="meta fade"></div>
        <div id="label" class="meta fade"></div>

        <div class="tracks">
          <h2 class="fade">Track listing</h2>
          <div id="tracks" class="tracks-box fade">
            <div style="opacity:.6;">Scan a record to show tracks</div>
          </div>
        </div>
      </div>
    </div>

    <div class="footer">Now Spinning</div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);

  const GAP_RESET_MS = 250;
  const SUBMIT_AFTER_MS = 180;

  let buffer = "";
  let lastKeyTime = 0;
  let submitTimer = null;

  function setStatus(text){
    const el = $("status");
    if (el) el.textContent = text;
  }

  function clearReveal() {
    const cover = $("cover");
    cover.classList.remove("show");
    cover.style.animationPlayState = "paused";

    const fades = document.querySelectorAll(".fade");
    for (const el of fades) el.classList.remove("show");
  }

  function clearDisplay(keepStatus) {
    $("title").textContent = "";
    $("artist").textContent = "";
    $("year").textContent = "";
    $("label").textContent = "";
    $("cover").src = "";
    $("tracks").innerHTML = "<div style='opacity:.6;'>Scan a record to show tracks</div>";
    if (!keepStatus) setStatus("Ready for scan…");

    document.documentElement.style.setProperty("--wash", "rgba(0,0,0,0)");
    document.documentElement.style.setProperty("--wash2", "rgba(0,0,0,0)");
    document.documentElement.style.setProperty("--title", "var(--fg)");
  }

  function stageReveal() {
    $("cover").classList.add("show");

    const steps = [
      { sel: "#title", ms: 90 },
      { sel: "#artist", ms: 140 },
      { sel: "#year", ms: 190 },
      { sel: "#label", ms: 230 },
      { sel: ".tracks h2", ms: 270 },
      { sel: "#tracks", ms: 310 }
    ];

    for (const s of steps) {
      setTimeout(() => {
        const el = document.querySelector(s.sel);
        if (el) el.classList.add("show");
      }, s.ms);
    }
  }

  function sideFromPosition(pos) {
    const m = String(pos || "").toUpperCase().match(/^([A-Z])/);
    return m ? m[1] : "";
  }

  /* ✅ Two-column renderer with side headings */
  function renderTracksTwoColumns(tracklist) {
    if (!Array.isArray(tracklist) || !tracklist.length) {
      $("tracks").innerHTML = "<div style='opacity:.6;'>No track listing found</div>";
      return;
    }

    const groups = {};
    const order = [];

    for (const t of tracklist) {
      const side = sideFromPosition(t.position);
      const key = side || "";
      if (!groups[key]) { groups[key] = []; order.push(key); }
      groups[key].push(t);
    }

    let html = "";

    for (const side of order) {
      if (side) html += `<div class="side">Side ${side}</div>`;

      // Wrap tracks for this side in a two-column container
      html += `<div class="cols">` + groups[side].map(t => {
        const pos = t.position ? `<span class="pos">${t.position}</span>` : "";
        const dur = t.duration ? ` <span class="dur">(${t.duration})</span>` : "";
        return `<span class="track">${pos}${t.title || ""}${dur}</span>`;
      }).join("") + `</div>`;
    }

    $("tracks").innerHTML = html;
  }

  function applyThemeFromCover(img) {
    try {
      const c = document.createElement("canvas");
      const ctx = c.getContext("2d", { willReadFrequently: true });
      c.width = c.height = 56;
      ctx.drawImage(img, 0, 0, 56, 56);
      const d = ctx.getImageData(0, 0, 56, 56).data;

      let r=0,g=0,b=0,l=0,n=0;

      for (let i=0;i<d.length;i+=4) {
        if (d[i+3] < 200) continue;
        const max=Math.max(d[i],d[i+1],d[i+2]);
        const min=Math.min(d[i],d[i+1],d[i+2]);
        if (max>245 && min>245) continue;
        if (max<18 && min<18) continue;

        r+=d[i]; g+=d[i+1]; b+=d[i+2];
        l+=0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2];
        n++;
      }
      if (!n) return;

      r=Math.round(r/n); g=Math.round(g/n); b=Math.round(b/n);

      const avg=(r+g+b)/3, boost=1.22;
      r=Math.min(255, Math.max(0, Math.round(avg+(r-avg)*boost)));
      g=Math.min(255, Math.max(0, Math.round(avg+(g-avg)*boost)));
      b=Math.min(255, Math.max(0, Math.round(avg+(b-avg)*boost)));

      document.documentElement.style.setProperty("--title", `rgb(${r},${g},${b})`);
      document.documentElement.style.setProperty("--wash",  `rgba(${r},${g},${b},0.18)`);
      document.documentElement.style.setProperty("--wash2", `rgba(${r},${g},${b},0.10)`);

      const dark = (l/n) < 110;

      document.documentElement.style.setProperty("--bg", dark ? "#0f1115" : "#ffffff");
      document.documentElement.style.setProperty("--fg", dark ? "#f0f2f5" : "#111111");
      document.documentElement.style.setProperty("--panel", dark ? "rgba(20,22,28,0.82)" : "rgba(255,255,255,0.86)");
      document.documentElement.style.setProperty("--border", dark ? "rgba(240,242,245,0.14)" : "rgba(0,0,0,0.14)");
      document.documentElement.style.setProperty("--muted", dark ? "rgba(240,242,245,0.72)" : "rgba(0,0,0,0.70)");
      document.documentElement.style.setProperty("--shadow", dark ? "rgba(0,0,0,0.44)" : "rgba(0,0,0,0.16)");
      document.documentElement.style.setProperty("--shadow2", dark ? "rgba(0,0,0,0.26)" : "rgba(0,0,0,0.08)");
    } catch {}
  }

  async function lookup(code) {
    if (!code || code.length < 10) return;

    setStatus("Looking up…");
    clearReveal();
    clearDisplay(true);

    try {
      const res = await fetch(`/api/lookup?barcode=${code}`);
      const data = await res.json();
      if (!res.ok) throw new Error("Lookup failed");

      $("title").textContent = data.title || "";
      $("artist").textContent = (data.artists||[]).join(" • ");
      $("year").textContent = data.year ? `Year: ${data.year}` : "";
      $("label").textContent = (data.labels||[]).length ? `Label: ${data.labels[0]}` : "";

      renderTracksTwoColumns(data.tracklist);

      if (data.cover) {
        const img = $("cover");
        img.onload = () => {
          applyThemeFromCover(img);
          img.style.animationPlayState = "running";
          stageReveal();
        };
        img.src = data.cover;
      } else {
        stageReveal();
      }

      setStatus(data.cached ? "Loaded (cached) — ready" : "Loaded — ready");
    } catch (e) {
      setStatus("Error — ready for scan…");
    }
  }

  function scheduleSubmit() {
    clearTimeout(submitTimer);
    submitTimer = setTimeout(() => {
      const c = buffer.replace(/\D/g,"");
      buffer = "";
      if (c.length >= 10) lookup(c);
    }, SUBMIT_AFTER_MS);
  }

  window.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;

    const now = Date.now();
    if (now - lastKeyTime > GAP_RESET_MS) buffer = "";
    lastKeyTime = now;

    if (e.key === "Enter") {
      const c = buffer.replace(/\D/g,"");
      buffer = "";
      if (c.length >= 10) lookup(c);
      return;
    }

    if (/[0-9]/.test(e.key)) {
      buffer += e.key;
      scheduleSubmit();
    }
  }, true);

  clearReveal();
  clearDisplay(false);
</script>

</body>
</html>
