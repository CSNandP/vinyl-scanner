<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=800, height=480, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <title>Vinyl Scanner</title>

  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 12px; }
    h1 { margin: 0 0 6px 0; font-size: 20px; }
    #status { font-size: 14px; margin: 4px 0 8px 0; opacity: 0.9; }

    .card { display: flex; gap: 12px; align-items: flex-start; }

    /* BIG cover */
    #cover {
      width: 392px;
      height: 392px;
      object-fit: cover;
      background: #eee;
      border-radius: 12px;
      flex: 0 0 auto;
    }

    .right {
      width: 372px;
      min-width: 0;
    }

    /* Title will be colourised dynamically */
    #title {
      font-size: 22px;
      font-weight: 800;
      line-height: 1.1;
      transition: color 0.4s ease;
    }

    /* Artist now bold */
    #artist {
      font-size: 14px;
      margin-top: 6px;
      font-weight: 800;
    }

    .meta {
      font-size: 14px;
      margin-top: 6px;
      opacity: 0.95;
    }

    .tracks { margin-top: 10px; }
    .tracks h2 { font-size: 14px; margin: 0 0 6px 0; font-weight: 800; }

    .tracks-box {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 8px 10px;
      background: #fafafa;
      max-height: 300px;
      overflow: auto;
    }

    .tracks-box ol { margin: 0; padding-left: 18px; }
    .tracks-box li { font-size: 13px; margin: 5px 0; }
    .pos { font-weight: 800; margin-right: 6px; }
    .dur { opacity: 0.7; margin-left: 6px; }
  </style>
</head>

<body>
  <h1>Vinyl Scanner</h1>
  <div id="status">Ready for scan…</div>

  <div class="card">
    <img id="cover" alt="Cover" crossorigin="anonymous"/>

    <div class="right">
      <div id="title"></div>
      <div id="artist"></div>
      <div id="year" class="meta"></div>
      <div id="label" class="meta"></div>

      <div class="tracks">
        <h2>Track listing</h2>
        <div id="tracks" class="tracks-box">
          <div style="opacity:.6;">Scan a record to show tracks</div>
        </div>
      </div>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);

  const GAP_RESET_MS = 250;
  const SUBMIT_AFTER_MS = 180;

  let buffer = "";
  let lastKeyTime = 0;
  let submitTimer = null;

  function escapeHtml(str) {
    return String(str)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function clearDisplay() {
    $("title").textContent = "";
    $("title").style.color = "";
    $("artist").textContent = "";
    $("year").textContent = "";
    $("label").textContent = "";
    $("cover").src = "";
    $("tracks").innerHTML = "<div style='opacity:.6;'>Scan a record to show tracks</div>";
    $("status").textContent = "Ready for scan…";
  }

  function renderTracks(tracklist) {
    if (!Array.isArray(tracklist) || tracklist.length === 0) {
      $("tracks").innerHTML = "<div style='opacity:.6;'>No track listing found</div>";
      return;
    }

    const items = tracklist.map(t => {
      const pos = t.position ? `<span class="pos">${escapeHtml(t.position)}</span>` : "";
      const title = escapeHtml(t.title || "");
      const dur = t.duration ? `<span class="dur">(${escapeHtml(t.duration)})</span>` : "";
      return `<li>${pos}${title}${dur}</li>`;
    }).join("");

    $("tracks").innerHTML = `<ol>${items}</ol>`;
  }

  /* ---- Colour extraction from album art ---- */
  function applyTitleColourFromImage(img) {
    try {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      const size = 40;

      canvas.width = size;
      canvas.height = size;

      ctx.drawImage(img, 0, 0, size, size);
      const data = ctx.getImageData(0, 0, size, size).data;

      let r = 0, g = 0, b = 0, count = 0;

      for (let i = 0; i < data.length; i += 4) {
        const alpha = data[i + 3];
        if (alpha < 200) continue;

        r += data[i];
        g += data[i + 1];
        b += data[i + 2];
        count++;
      }

      if (!count) return;

      r = Math.round(r / count);
      g = Math.round(g / count);
      b = Math.round(b / count);

      // Boost saturation slightly
      const boost = 1.15;
      r = Math.min(255, Math.round(r * boost));
      g = Math.min(255, Math.round(g * boost));
      b = Math.min(255, Math.round(b * boost));

      $("title").style.color = `rgb(${r}, ${g}, ${b})`;
    } catch {
      // fail silently
    }
  }

  async function lookup(barcode) {
    if (!barcode || barcode.length < 10) {
      $("status").textContent = "Scan error — ready for scan…";
      return;
    }

    $("status").textContent = "Looking up…";
    clearDisplay();

    try {
      const res = await fetch(`/api/lookup?barcode=${encodeURIComponent(barcode)}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Lookup failed");

      $("status").textContent = "Loaded — ready for scan…";
      $("title").textContent = data.title || "";
      $("artist").textContent = (data.artists || []).join(" • ");
      $("year").textContent = data.year ? `Year: ${data.year}` : "";
      $("label").textContent = (data.labels && data.labels.length) ? `Label: ${data.labels[0]}` : "";

      if (data.cover) {
        const img = $("cover");
        img.onload = () => applyTitleColourFromImage(img);
        img.src = data.cover;
      }

      renderTracks(data.tracklist);
    } catch (e) {
      $("status").textContent = "Error — ready for scan…";
    }
  }

  function scheduleSubmit() {
    if (submitTimer) clearTimeout(submitTimer);
    submitTimer = setTimeout(() => {
      const barcode = buffer.replace(/\D/g, "");
      buffer = "";
      if (barcode.length >= 10) lookup(barcode);
    }, SUBMIT_AFTER_MS);
  }

  function onAnyKey(e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;

    const now = Date.now();
    if (now - lastKeyTime > GAP_RESET_MS) buffer = "";
    lastKeyTime = now;

    if (e.key === "Enter") {
      const barcode = buffer.replace(/\D/g, "");
      buffer = "";
      if (barcode.length >= 10) lookup(barcode);
      return;
    }

    if (e.key.length === 1 && /[0-9]/.test(e.key)) {
      buffer += e.key;
      scheduleSubmit();
    }
  }

  window.addEventListener("keydown", onAnyKey, true);
  clearDisplay();
</script>

</body>
</html>
