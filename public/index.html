<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=800, height=480, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <title>Vinyl Scanner</title>

  <style>
    :root {
      --bg: #ffffff;
      --fg: #111111;
      --muted: rgba(0,0,0,0.70);
      --panel: rgba(255,255,255,0.88);
      --border: rgba(0,0,0,0.14);
      --wash: rgba(0,0,0,0.00);
      --title: #111111;
    }

    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 12px;
      background:
        linear-gradient(180deg, var(--wash), rgba(0,0,0,0) 65%),
        var(--bg);
      color: var(--fg);
      transition: background 0.6s ease, color 0.6s ease;
    }

    h1 { margin: 0 0 6px 0; font-size: 18px; opacity: 0.85; }
    #status { font-size: 13px; margin: 4px 0 8px 0; color: var(--muted); }

    .card { display: flex; gap: 12px; align-items: flex-start; }

    /* ---------- RECORD PLAYER ---------- */

    .platter {
      position: relative;
      width: 392px;
      height: 392px;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    .platter::before {
      content: "";
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      background:
        radial-gradient(circle,
          rgba(0,0,0,0.14) 0%,
          rgba(0,0,0,0.08) 40%,
          rgba(0,0,0,0.03) 60%,
          rgba(0,0,0,0.00) 72%);
      filter: blur(8px);
      z-index: 0;
    }

    #cover {
      position: relative;
      z-index: 1;
      width: 392px;
      height: 392px;
      border-radius: 50%;
      object-fit: cover;
      background: #eee;
      box-shadow: 0 10px 26px rgba(0,0,0,0.18);
      animation: spin 28s linear infinite;
      animation-play-state: paused;
    }

    .label-ring {
      position: absolute;
      inset: 0;
      margin: auto;
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background:
        radial-gradient(circle,
          rgba(255,255,255,0.00) 0%,
          rgba(255,255,255,0.00) 58%,
          rgba(255,255,255,0.28) 60%,
          rgba(255,255,255,0.00) 66%);
      pointer-events: none;
      z-index: 2;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* ---------- INFO PANEL ---------- */

    .right {
      width: 372px;
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 8px 26px rgba(0,0,0,0.06);
      transition: background 0.6s ease, border-color 0.6s ease;
    }

    #title {
      font-size: 22px;
      font-weight: 850;
      letter-spacing: -0.2px;
      line-height: 1.1;
      color: var(--title);
      transition: color 0.6s ease;
    }

    #artist {
      font-size: 14px;
      margin-top: 6px;
      font-weight: 850;
      opacity: 0.95;
    }

    .meta {
      font-size: 13px;
      margin-top: 6px;
      color: var(--muted);
    }

    .tracks { margin-top: 10px; }
    .tracks h2 {
      font-size: 13px;
      margin: 0 0 6px 0;
      font-weight: 850;
      color: var(--muted);
    }

    .tracks-box {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 10px;
      background: rgba(255,255,255,0.55);
      max-height: 300px;
      overflow: auto;
    }

    .side {
      margin: 8px 0 6px 0;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.6px;
      opacity: 0.7;
      text-transform: uppercase;
    }

    .tracks-box ol { margin: 0; padding-left: 18px; }
    .tracks-box li { font-size: 13px; margin: 5px 0; }
    .pos { font-weight: 900; margin-right: 6px; }
    .dur { opacity: 0.7; margin-left: 6px; }
  </style>
</head>

<body>
  <h1>Vinyl Scanner</h1>
  <div id="status">Ready for scan…</div>

  <div class="card">
    <div class="platter">
      <img id="cover" alt="Cover"/>
      <div class="label-ring"></div>
    </div>

    <div class="right">
      <div id="title"></div>
      <div id="artist"></div>
      <div id="year" class="meta"></div>
      <div id="label" class="meta"></div>

      <div class="tracks">
        <h2>Track listing</h2>
        <div id="tracks" class="tracks-box">
          <div style="opacity:.6;">Scan a record to show tracks</div>
        </div>
      </div>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);

  const GAP_RESET_MS = 250;
  const SUBMIT_AFTER_MS = 180;

  let buffer = "";
  let lastKeyTime = 0;
  let submitTimer = null;

  function clearDisplay() {
    $("title").textContent = "";
    $("artist").textContent = "";
    $("year").textContent = "";
    $("label").textContent = "";
    $("cover").src = "";
    $("tracks").innerHTML = "<div style='opacity:.6;'>Scan a record to show tracks</div>";
    $("status").textContent = "Ready for scan…";
    $("cover").style.animationPlayState = "paused";

    document.documentElement.style.setProperty("--wash", "rgba(0,0,0,0)");
    document.documentElement.style.setProperty("--title", "var(--fg)");
  }

  function sideFromPosition(pos) {
    const m = String(pos || "").toUpperCase().match(/^([A-Z])/);
    return m ? m[1] : "";
  }

  function renderTracksGrouped(tracklist) {
    if (!Array.isArray(tracklist) || !tracklist.length) {
      $("tracks").innerHTML = "<div style='opacity:.6;'>No track listing found</div>";
      return;
    }

    const groups = {};
    const order = [];

    for (const t of tracklist) {
      const side = sideFromPosition(t.position);
      if (!groups[side]) { groups[side] = []; order.push(side); }
      groups[side].push(t);
    }

    let html = "";
    for (const side of order) {
      if (side) html += `<div class="side">Side ${side}</div>`;
      html += "<ol>" + groups[side].map(t =>
        `<li><span class="pos">${t.position || ""}</span>${t.title || ""}${t.duration ? ` <span class="dur">(${t.duration})</span>` : ""}</li>`
      ).join("") + "</ol>";
    }

    $("tracks").innerHTML = html;
  }

  /* ---- THEME EXTRACTION FROM ARTWORK ---- */
  function applyThemeFromCover(img) {
    try {
      const c = document.createElement("canvas");
      const ctx = c.getContext("2d", { willReadFrequently: true });
      c.width = c.height = 48;
      ctx.drawImage(img, 0, 0, 48, 48);
      const d = ctx.getImageData(0, 0, 48, 48).data;

      let r=0,g=0,b=0,l=0,n=0;

      for (let i=0;i<d.length;i+=4) {
        if (d[i+3] < 200) continue;
        const max=Math.max(d[i],d[i+1],d[i+2]);
        const min=Math.min(d[i],d[i+1],d[i+2]);
        if (max>245 && min>245) continue;
        if (max<18 && min<18) continue;

        r+=d[i]; g+=d[i+1]; b+=d[i+2];
        l+=0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2];
        n++;
      }
      if (!n) return;

      r=Math.round(r/n); g=Math.round(g/n); b=Math.round(b/n);
      const avg=(r+g+b)/3, boost=1.2;
      r=Math.min(255,avg+(r-avg)*boost);
      g=Math.min(255,avg+(g-avg)*boost);
      b=Math.min(255,avg+(b-avg)*boost);

      document.documentElement.style.setProperty("--title", `rgb(${r},${g},${b})`);
      document.documentElement.style.setProperty("--wash", `rgba(${r},${g},${b},0.16)`);

      const dark = (l/n) < 110;
      document.documentElement.style.setProperty("--bg", dark ? "#0f1115" : "#ffffff");
      document.documentElement.style.setProperty("--fg", dark ? "#f0f2f5" : "#111111");
      document.documentElement.style.setProperty("--panel", dark ? "rgba(20,22,28,0.84)" : "rgba(255,255,255,0.88)");
      document.documentElement.style.setProperty("--border", dark ? "rgba(240,242,245,0.14)" : "rgba(0,0,0,0.14)");
      document.documentElement.style.setProperty("--muted", dark ? "rgba(240,242,245,0.7)" : "rgba(0,0,0,0.7)");
    } catch {}
  }

  async function lookup(code) {
    $("status").textContent = "Looking up…";
    clearDisplay();

    const res = await fetch(`/api/lookup?barcode=${code}`);
    const data = await res.json();
    if (!res.ok) return $("status").textContent="Error — ready for scan…";

    $("title").textContent = data.title || "";
    $("artist").textContent = (data.artists||[]).join(" • ");
    $("year").textContent = data.year ? `Year: ${data.year}` : "";
    $("label").textContent = (data.labels||[]).length ? `Label: ${data.labels[0]}` : "";

    if (data.cover) {
      const img = $("cover");
      img.onload = () => {
        applyThemeFromCover(img);
        img.style.animationPlayState = "running";
      };
      img.src = data.cover;
    }

    renderTracksGrouped(data.tracklist);
    $("status").textContent = "Loaded — ready for scan…";
  }

  function scheduleSubmit() {
    clearTimeout(submitTimer);
    submitTimer=setTimeout(()=>{
      const c=buffer.replace(/\D/g,"");
      buffer="";
      if(c.length>=10) lookup(c);
    },SUBMIT_AFTER_MS);
  }

  window.addEventListener("keydown",e=>{
    if(e.ctrlKey||e.metaKey||e.altKey)return;
    const now=Date.now();
    if(now-lastKeyTime>GAP_RESET_MS)buffer="";
    lastKeyTime=now;
    if(e.key==="Enter")return lookup(buffer.replace(/\D/g,""));
    if(/[0-9]/.test(e.key)){buffer+=e.key; scheduleSubmit();}
  });

  clearDisplay();
</script>

</body>
</html>
