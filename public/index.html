<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=800, height=480, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <title>Vinyl Scanner</title>

  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 14px; }
    h1 { margin: 0 0 8px 0; font-size: 22px; }

    #status { font-size: 16px; margin: 6px 0 10px 0; opacity: 0.85; }

    .card { display: flex; gap: 14px; align-items: flex-start; }
    #cover {
      width: 310px;
      height: 310px;
      object-fit: cover;
      background: #eee;
      border-radius: 12px;
    }

    #title { font-size: 26px; font-weight: 800; line-height: 1.1; }
    .meta { font-size: 16px; margin-top: 6px; opacity: 0.95; }

    .tracks { margin-top: 10px; }
    .tracks h2 { font-size: 16px; margin: 0 0 6px 0; font-weight: 800; }

    .tracks-box {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 8px 10px;
      background: #fafafa;
      max-height: 170px; /* fits 800x480 nicely */
      overflow: auto;
    }
    .tracks-box ol { margin: 0; padding-left: 20px; }
    .tracks-box li { font-size: 14px; margin: 5px 0; }
    .pos { font-weight: 800; margin-right: 6px; }
    .dur { opacity: 0.7; margin-left: 6px; }

    /* Hidden input to keep scanner happy */
    #scannerInput {
      position: fixed;
      left: -9999px;
      top: -9999px;
      opacity: 0;
      width: 1px;
      height: 1px;
    }
  </style>
</head>

<body>
  <h1>Vinyl Scanner</h1>
  <div id="status">Ready for scan…</div>

  <div class="card">
    <img id="cover" alt="Cover"/>

    <div style="flex:1;">
      <div id="title"></div>
      <div id="artist" class="meta"></div>
      <div id="year" class="meta"></div>
      <div id="label" class="meta"></div>

      <div class="tracks">
        <h2>Track listing</h2>
        <div id="tracks" class="tracks-box">
          <div style="opacity:.6;">Scan a record to show tracks</div>
        </div>
      </div>
    </div>
  </div>
