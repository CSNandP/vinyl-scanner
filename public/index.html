<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=800, height=480, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <title>Vinyl Scanner</title>

  <style>
    :root {
      --bg: #ffffff;
      --fg: #111111;
      --muted: rgba(0,0,0,0.70);
      --panel: rgba(255,255,255,0.88);
      --border: rgba(0,0,0,0.14);
      --wash: rgba(0,0,0,0.00);
      --title: #111111;
    }

    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 12px;
      background: linear-gradient(180deg, var(--wash), rgba(0,0,0,0) 60%), var(--bg);
      color: var(--fg);
      transition: background 0.5s ease, color 0.5s ease;
    }

    h1 { margin: 0 0 6px 0; font-size: 18px; opacity: 0.9; }
    #status { font-size: 13px; margin: 4px 0 8px 0; color: var(--muted); }

    .card { display: flex; gap: 12px; align-items: flex-start; }

    /* ---------- RECORD PLAYER VISUAL ---------- */

    .platter {
      position: relative;
      width: 392px;
      height: 392px;
      border-radius: 50%;
      flex: 0 0 auto;
    }

    /* soft platter shadow */
    .platter::before {
      content: "";
      position: absolute;
      inset: -10px;
      border-radius: 50%;
      background:
        radial-gradient(circle at center,
          rgba(0,0,0,0.10) 0%,
          rgba(0,0,0,0.06) 45%,
          rgba(0,0,0,0.02) 60%,
          rgba(0,0,0,0.00) 72%);
      filter: blur(6px);
      z-index: 0;
    }

    /* rotating record */
    #cover {
      position: relative;
      z-index: 1;
      width: 392px;
      height: 392px;
      border-radius: 50%; /* key vinyl cue */
      object-fit: cover;
      background: #eee;
      box-shadow: 0 10px 26px rgba(0,0,0,0.18);
      animation: spin 28s linear infinite;
      animation-play-state: paused; /* start idle */
    }

    /* subtle centre label ring */
    .label-ring {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 96px;
      height: 96px;
      margin-left: -48px;
      margin-top: -48px;
      border-radius: 50%;
      background:
        radial-gradient(circle at center,
          rgba(255,255,255,0.00) 0%,
          rgba(255,255,255,0.00) 58%,
          rgba(255,255,255,0.25) 60%,
          rgba(255,255,255,0.00) 66%);
      pointer-events: none;
      z-index: 2;
    }

    @keyframes spin {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    /* ---------- INFO PANEL ---------- */

    .right {
      width: 372px;
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      box-shadow: 0 8px 26px rgba(0,0,0,0.06);
      transition: background 0.5s ease, border-color 0.5s ease;
    }

    #title {
      font-size: 22px;
      font-weight: 850;
      line-height: 1.1;
      letter-spacing: -0.2px;
      color: var(--title);
      transition: color 0.5s ease;
    }

    #artist {
      font-size: 14px;
      margin-top: 6px;
      font-weight: 850;
      opacity: 0.95;
    }

    .meta {
      font-size: 13px;
      margin-top: 6px;
      color: var(--muted);
    }

    .tracks { margin-top: 10px; }
    .tracks h2 {
      font-size: 13px;
      margin: 0 0 6px 0;
      font-weight: 850;
      color: var(--muted);
    }

    .tracks-box {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 10px;
      background: rgba(255,255,255,0.55);
      max-height: 300px;
      overflow: auto;
    }

    .side {
      margin: 8px 0 6px 0;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.6px;
      opacity: 0.7;
      text-transform: uppercase;
    }

    .tracks-box ol { margin: 0; padding-left: 18px; }
    .tracks-box li { font-size: 13px; margin: 5px 0; }
    .pos { font-weight: 900; margin-right: 6px; }
    .dur { opacity: 0.7; margin-left: 6px; }
  </style>
</head>

<body>
  <h1>Vinyl Scanner</h1>
  <div id="status">Ready for scan…</div>

  <div class="card">
    <div class="platter">
      <img id="cover" alt="Cover"/>
      <div class="label-ring"></div>
    </div>

    <div class="right">
      <div id="title"></div>
      <div id="artist"></div>
      <div id="year" class="meta"></div>
      <div id="label" class="meta"></div>

      <div class="tracks">
        <h2>Track listing</h2>
        <div id="tracks" class="tracks-box">
          <div style="opacity:.6;">Scan a record to show tracks</div>
        </div>
      </div>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);

  const GAP_RESET_MS = 250;
  const SUBMIT_AFTER_MS = 180;

  let buffer = "";
  let lastKeyTime = 0;
  let submitTimer = null;

  function clearDisplay() {
    $("title").textContent = "";
    $("artist").textContent = "";
    $("year").textContent = "";
    $("label").textContent = "";
    $("cover").src = "";
    $("tracks").innerHTML = "<div style='opacity:.6;'>Scan a record to show tracks</div>";
    $("status").textContent = "Ready for scan…";
    $("cover").style.animationPlayState = "paused";
  }

  function sideFromPosition(pos) {
    const p = String(pos || "").trim().toUpperCase();
    const m = p.match(/^([A-Z])/);
    return m ? m[1] : "";
  }

  function renderTracksGrouped(tracklist) {
    if (!Array.isArray(tracklist) || !tracklist.length) {
      $("tracks").innerHTML = "<div style='opacity:.6;'>No track listing found</div>";
      return;
    }

    const groups = {};
    const order = [];

    for (const t of tracklist) {
      const side = sideFromPosition(t.position);
      if (!groups[side]) { groups[side] = []; order.push(side); }
      groups[side].push(t);
    }

    let html = "";
    for (const side of order) {
      if (side) html += `<div class="side">Side ${side}</div>`;
      html += "<ol>" + groups[side].map(t =>
        `<li><span class="pos">${t.position || ""}</span>${t.title || ""}${t.duration ? ` <span class="dur">(${t.duration})</span>` : ""}</li>`
      ).join("") + "</ol>";
    }

    $("tracks").innerHTML = html;
  }

  async function lookup(barcode) {
    $("status").textContent = "Looking up…";
    clearDisplay();

    const res = await fetch(`/api/lookup?barcode=${barcode}`);
    const data = await res.json();
    if (!res.ok) {
      $("status").textContent = "Error — ready for scan…";
      return;
    }

    $("title").textContent = data.title || "";
    $("artist").textContent = (data.artists || []).join(" • ");
    $("year").textContent = data.year ? `Year: ${data.year}` : "";
    $("label").textContent = (data.labels || []).length ? `Label: ${data.labels[0]}` : "";

    if (data.cover) {
      const img = $("cover");
      img.onload = () => {
        img.style.animationPlayState = "running"; // start spinning
      };
      img.src = data.cover;
    }

    renderTracksGrouped(data.tracklist);
    $("status").textContent = "Loaded — ready for scan…";
  }

  function scheduleSubmit() {
    if (submitTimer) clearTimeout(submitTimer);
    submitTimer = setTimeout(() => {
      const code = buffer.replace(/\D/g, "");
      buffer = "";
      if (code.length >= 10) lookup(code);
    }, SUBMIT_AFTER_MS);
  }

  window.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;

    const now = Date.now();
    if (now - lastKeyTime > GAP_RESET_MS) buffer = "";
    lastKeyTime = now;

    if (e.key === "Enter") {
      const code = buffer.replace(/\D/g, "");
      buffer = "";
      if (code.length >= 10) lookup(code);
      return;
    }

    if (/[0-9]/.test(e.key)) {
      buffer += e.key;
      scheduleSubmit();
    }
  });

  clearDisplay();
</script>

</body>
</html>
