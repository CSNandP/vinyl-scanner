<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Vinyl Scanner</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; }
    h1 { margin: 0 0 12px 0; }
    .row { display:flex; gap:12px; align-items:flex-start; }
    input { font-size: 26px; padding: 12px; width: 100%; }
    button { font-size: 26px; padding: 12px 16px; }
    img { width: 280px; height: 280px; object-fit: cover; background:#eee; border-radius: 10px; }
    .meta { font-size: 20px; margin-top: 8px; }
    .small { font-size: 14px; opacity: 0.75; margin-top: 12px; word-break: break-word; }
    .card { margin-top: 16px; display:flex; gap:16px; align-items:flex-start; }

    /* Tracklist area (scrolls nicely on 7" screen) */
    .tracks-wrap { margin-top: 16px; }
    .tracks-title { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .tracks-box {
      border: 1px solid #ddd;
      border-radius: 10px;
      padding: 10px 12px;
      max-height: 220px;
      overflow: auto;
      background: #fafafa;
    }
    .tracks-box ol { margin: 0; padding-left: 22px; }
    .tracks-box li { margin: 6px 0; font-size: 18px; }
    .pos { font-weight: 700; margin-right: 6px; }
    .dur { opacity: 0.7; margin-left: 8px; }
  </style>
</head>
<body>
  <h1>Vinyl Scanner</h1>

  <div class="row">
    <input id="barcode" placeholder="Scan or type barcode…" inputmode="numeric" autocomplete="off"/>
    <button id="go">Search</button>
  </div>

  <div id="status" class="meta">Ready</div>

  <div class="card">
    <img id="cover" alt="Cover"/>
    <div style="flex:1;">
      <div id="title" style="font-size:30px; font-weight:700;"></div>
      <div id="artist" class="meta"></div>
      <div id="year" class="meta"></div>
      <div id="label" class="meta"></div>
      <div id="link" class="small"></div>

      <!-- NEW: Track listing goes here -->
      <div class="tracks-wrap">
        <div class="tracks-title">Track listing</div>
        <div id="tracks" class="tracks-box"></div>
      </div>
    </div>
  </div>

  <script>
    const $ = (id) => document.getElementById(id);

    function clearDisplay() {
      $("title").textContent = "";
      $("artist").textContent = "";
      $("year").textContent = "";
      $("label").textContent = "";
      $("link").textContent = "";
      $("cover").src = "";
      $("tracks").innerHTML = "";
    }

    function renderTracks(tracklist) {
      const tracks = Array.isArray(tracklist) ? tracklist : [];
      if (!tracks.length) {
        $("tracks").innerHTML = `<div style="opacity:.7;">No track listing found.</div>`;
        return;
      }

      const items = tracks.map(t => {
        const pos = t.position ? `<span class="pos">${escapeHtml(t.position)}</span>` : "";
        const title = escapeHtml(t.title || "");
        const dur = t.duration ? `<span class="dur">(${escapeHtml(t.duration)})</span>` : "";
        return `<li>${pos}${title}${dur}</li>`;
      }).join("");

      $("tracks").innerHTML = `<ol>${items}</ol>`;
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }

    async function lookup() {
      const raw = $("barcode").value || "";
      const barcode = raw.replace(/\D/g, "");

      if (barcode.length < 10) {
        $("status").textContent = "Please enter a valid barcode (10+ digits).";
        return;
      }

      $("status").textContent = "Looking up…";
      clearDisplay();

      try {
        const res = await fetch(`/api/lookup?barcode=${encodeURIComponent(barcode)}`);
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || "Lookup failed");

        $("status").textContent = data.cached ? "Ready (cached)" : "Ready";
        $("title").textContent = data.title || "";
        $("artist").textContent = (data.artists || []).join(" • ");
        $("year").textContent = data.year ? `Year: ${data.year}` : "";
        $("label").textContent = (data.label
