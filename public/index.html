<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=800, height=480, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <title>Vinyl Scanner</title>

  <style>
    :root {
      --bg: #ffffff;
      --fg: #111111;
      --muted: rgba(0,0,0,0.70);
      --panel: rgba(255,255,255,0.88);
      --border: rgba(0,0,0,0.14);
      --wash: rgba(0,0,0,0.00);
      --title: #111111;
    }

    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 12px;
      background: linear-gradient(180deg, var(--wash), rgba(0,0,0,0) 60%), var(--bg);
      color: var(--fg);
      transition: background 0.5s ease, color 0.5s ease;
    }

    h1 { margin: 0 0 6px 0; font-size: 18px; opacity: 0.9; }

    #status {
      font-size: 13px;
      margin: 4px 0 8px 0;
      color: var(--muted);
    }

    .card {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    /* Big cover left */
    #cover {
      width: 392px;
      height: 392px;
      object-fit: cover;
      background: #eee;
      border-radius: 12px;
      flex: 0 0 auto;
      box-shadow: 0 8px 26px rgba(0,0,0,0.15);
    }

    .right {
      width: 372px;
      min-width: 0;
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 10px;
      box-shadow: 0 8px 26px rgba(0,0,0,0.06);
      transition: background 0.5s ease, border-color 0.5s ease;
    }

    #title {
      font-size: 22px;
      font-weight: 850;
      line-height: 1.1;
      color: var(--title);
      transition: color 0.5s ease;
    }

    #artist {
      font-size: 14px;
      margin-top: 6px;
      font-weight: 850; /* bold artist */
      opacity: 0.95;
    }

    .meta {
      font-size: 13px;
      margin-top: 6px;
      color: var(--muted);
    }

    .tracks { margin-top: 10px; }
    .tracks h2 {
      font-size: 13px;
      margin: 0 0 6px 0;
      font-weight: 850;
      color: var(--muted);
      letter-spacing: 0.2px;
    }

    /* Deeper/taller track area; narrow because right column is narrow */
    .tracks-box {
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 8px 10px;
      background: rgba(255,255,255,0.55);
      max-height: 300px;
      overflow: auto;
      transition: background 0.5s ease, border-color 0.5s ease;
    }

    .side {
      margin: 8px 0 6px 0;
      font-size: 12px;
      font-weight: 900;
      letter-spacing: 0.6px;
      opacity: 0.75;
      text-transform: uppercase;
    }

    .tracks-box ol { margin: 0; padding-left: 18px; }
    .tracks-box li { font-size: 13px; margin: 5px 0; }
    .pos { font-weight: 900; margin-right: 6px; }
    .dur { opacity: 0.7; margin-left: 6px; }

    /* Fade-in animation for new results */
    .fade {
      opacity: 0;
      transform: translateY(6px);
    }
    .fade.show {
      opacity: 1;
      transform: translateY(0);
      transition: opacity 0.35s ease, transform 0.35s ease;
    }
  </style>
</head>

<body>
  <h1>Vinyl Scanner</h1>
  <div id="status">Ready for scan…</div>

  <div class="card">
    <img id="cover" alt="Cover" crossorigin="anonymous"/>

    <div class="right fade" id="panel">
      <div id="title"></div>
      <div id="artist"></div>
      <div id="year" class="meta"></div>
      <div id="label" class="meta"></div>

      <div class="tracks">
        <h2>Track listing</h2>
        <div id="tracks" class="tracks-box">
          <div style="opacity:.6;">Scan a record to show tracks</div>
        </div>
      </div>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);

  // Touch-free scanner buffering
  const GAP_RESET_MS = 250;
  const SUBMIT_AFTER_MS = 180;

  let buffer = "";
  let lastKeyTime = 0;
  let submitTimer = null;

  function escapeHtml(str) {
    return String(str)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function clearDisplay(keepStatus) {
    $("title").textContent = "";
    $("artist").textContent = "";
    $("year").textContent = "";
    $("label").textContent = "";
    $("cover").src = "";
    $("tracks").innerHTML = "<div style='opacity:.6;'>Scan a record to show tracks</div>";
    if (!keepStatus) $("status").textContent = "Ready for scan…";

    // Reset theme to neutral
    document.documentElement.style.setProperty("--wash", "rgba(0,0,0,0.00)");
    document.documentElement.style.setProperty("--title", "var(--fg)");
  }

  // --- Track grouping by side (A/B/C/D etc.) ---
  function sideFromPosition(pos) {
    const p = String(pos || "").trim().toUpperCase();
    if (!p) return "";
    // Typical vinyl: A1, B2, C1... or A, B etc.
    const m = p.match(/^([A-Z])/);
    return m ? m[1] : "";
  }

  function renderTracksGrouped(tracklist) {
    if (!Array.isArray(tracklist) || tracklist.length === 0) {
      $("tracks").innerHTML = "<div style='opacity:.6;'>No track listing found</div>";
      return;
    }

    // Group by side letter
    const groups = {};   // {A: [...], B: [...], "": [...]}
    const order = [];

    for (const t of tracklist) {
      const side = sideFromPosition(t.position);
      const key = side || ""; // unknown side
      if (!groups[key]) {
        groups[key] = [];
        order.push(key);
      }
      groups[key].push(t);
    }

    // Render groups in the order they appeared
    let html = "";
    for (const key of order) {
      if (key) {
        html += `<div class="side">Side ${escapeHtml(key)}</div>`;
      }

      const items = groups[key].map(t => {
        const pos = t.position ? `<span class="pos">${escapeHtml(t.position)}</span>` : "";
        const title = escapeHtml(t.title || "");
        const dur = t.duration ? `<span class="dur">(${escapeHtml(t.duration)})</span>` : "";
        return `<li>${pos}${title}${dur}</li>`;
      }).join("");

      html += `<ol>${items}</ol>`;
    }

    $("tracks").innerHTML = html;
  }

  // --- Colour + brightness extraction from cover (for title + theme wash) ---
  function applyThemeFromCover(imgEl) {
    try {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d", { willReadFrequently: true });

      const size = 48;
      canvas.width = size;
      canvas.height = size;

      ctx.drawImage(imgEl, 0, 0, size, size);
      const data = ctx.getImageData(0, 0, size, size).data;

      let rSum = 0, gSum = 0, bSum = 0, count = 0;
      let lumSum = 0;

      for (let i = 0; i < data.length; i += 4) {
        const a = data[i + 3];
        if (a < 200) continue;

        const r = data[i], g = data[i + 1], b = data[i + 2];

        // Ignore near-white and near-black pixels (often background/borders)
        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        if (max > 245 && min > 245) continue;
        if (max < 18 && min < 18) continue;

        rSum += r; gSum += g; bSum += b; count++;

        // Relative luminance
        const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
        lumSum += lum;
      }

      if (!count) return;

      let r = Math.round(rSum / count);
      let g = Math.round(gSum / count);
      let b = Math.round(bSum / count);

      // Boost saturation a touch by pushing away from grey
      const avg = Math.round((r + g + b) / 3);
      const satBoost = 1.20;
      r = Math.min(255, Math.max(0, Math.round(avg + (r - avg) * satBoost)));
      g = Math.min(255, Math.max(0, Math.round(avg + (g - avg) * satBoost)));
      b = Math.min(255, Math.max(0, Math.round(avg + (b - avg) * satBoost)));

      // Title colour (from artwork)
      document.documentElement.style.setProperty("--title", `rgb(${r}, ${g}, ${b})`);

      // Background wash (very subtle)
      document.documentElement.style.setProperty("--wash", `rgba(${r}, ${g}, ${b}, 0.16)`);

      // Dark/light mode based on brightness of sampled pixels
      const avgLum = lumSum / count; // 0-255
      const isDarkCover = avgLum < 110;

      if (isDarkCover) {
        document.documentElement.style.setProperty("--bg", "#0f1115");
        document.documentElement.style.setProperty("--fg", "#f0f2f5");
        document.documentElement.style.setProperty("--muted", "rgba(240,242,245,0.70)");
        document.documentElement.style.setProperty("--panel", "rgba(20,22,28,0.84)");
        document.documentElement.style.setProperty("--border", "rgba(240,242,245,0.14)");
      } else {
        document.documentElement.style.setProperty("--bg", "#ffffff");
        document.documentElement.style.setProperty("--fg", "#111111");
        document.documentElement.style.setProperty("--muted", "rgba(0,0,0,0.70)");
        document.documentElement.style.setProperty("--panel", "rgba(255,255,255,0.88)");
        document.documentElement.style.setProperty("--border", "rgba(0,0,0,0.14)");
      }
    } catch {
      // If canvas is blocked for any reason, we simply don't theme it
    }
  }

  function showPanelFade() {
    const panel = $("panel");
    panel.classList.remove("show");
    // force reflow
    void panel.offsetWidth;
    panel.classList.add("show");
  }

  async function lookup(barcode) {
    if (!barcode || barcode.length < 10) {
      $("status").textContent = "Scan error — ready for scan…";
      return;
    }

    $("status").textContent = "Looking up…";
    clearDisplay(true);
    showPanelFade();

    try {
      const res = await fetch(`/api/lookup?barcode=${encodeURIComponent(barcode)}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Lookup failed");

      $("status").textContent = data.cached ? "Loaded (cached) — ready for scan…" : "Loaded — ready for scan…";
      $("title").textContent = data.title || "";
      $("artist").textContent = (data.artists || []).join(" • ");
      $("year").textContent = data.year ? `Year: ${data.year}` : "";
      $("label").textContent = (data.labels && data.labels.length) ? `Label: ${data.labels[0]}` : "";

      if (data.cover) {
        const img = $("cover");
        img.onload = () => {
          applyThemeFromCover(img);
          showPanelFade(); // gentle refresh once colours apply
        };
        img.src = data.cover;
      }

      renderTracksGrouped(data.tracklist);
      showPanelFade();
    } catch (e) {
      $("status").textContent = "Error — ready for scan…";
    }
  }

  function scheduleSubmit() {
    if (submitTimer) clearTimeout(submitTimer);
    submitTimer = setTimeout(() => {
      const barcode = buffer.replace(/\D/g, "");
      buffer = "";
      if (barcode.length >= 10) lookup(barcode);
    }, SUBMIT_AFTER_MS);
  }

  function onAnyKey(e) {
    if (e.ctrlKey || e.metaKey || e.altKey) return;

    const now = Date.now();
    if (now - lastKeyTime > GAP_RESET_MS) buffer = "";
    lastKeyTime = now;

    if (e.key === "Enter") {
      const barcode = buffer.replace(/\D/g, "");
      buffer = "";
      if (barcode.length >= 10) lookup(barcode);
      return;
    }

    if (e.key.length === 1 && /[0-9]/.test(e.key)) {
      buffer += e.key;
      scheduleSubmit();
    }
  }

  window.addEventListener("keydown", onAnyKey, true);

  // start with neutral state + fade container ready
  $("panel").classList.add("show");
  clearDisplay(false);
</script>

</body>
</html>
