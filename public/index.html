<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Vinyl Scanner</title>

  <style>
    body {
      font-family: system-ui, sans-serif;
      margin: 0;
      padding: 16px;
    }

    h1 { margin: 0 0 12px 0; }

    .row {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    /* Barcode input row (we will HIDE this after first successful scan/search) */
    #inputRow input {
      font-size: 28px;
      padding: 12px;
      width: 100%;
    }
    #inputRow button {
      font-size: 28px;
      padding: 12px 16px;
    }

    #status {
      font-size: 20px;
      margin-top: 10px;
    }

    .card {
      margin-top: 14px;
      display: flex;
      gap: 18px;
      align-items: flex-start;
    }

    /* BIGGER cover art */
    #cover {
      width: 360px;
      height: 360px;
      object-fit: cover;
      background: #eee;
      border-radius: 14px;
    }

    #title {
      font-size: 34px;
      font-weight: 800;
      line-height: 1.15;
    }

    .meta {
      font-size: 22px;
      margin-top: 10px;
    }

    /* Track listing - bigger box so you usually won't need to scroll */
    .tracks {
      margin-top: 16px;
    }

    .tracks h2 {
      font-size: 24px;
      margin: 0 0 10px 0;
    }

    .tracks-box {
      border: 1px solid #ddd;
      border-radius: 14px;
      padding: 10px 14px;
      background: #fafafa;

      /* Bigger than before */
      max-height: 520px;
      overflow-y: auto;
    }

    .tracks-box ol {
      margin: 0;
      padding-left: 24px;
    }

    .tracks-box li {
      font-size: 20px;
      margin: 8px 0;
    }

    .pos { font-weight: 800; margin-right: 6px; }
    .dur { opacity: 0.7; margin-left: 8px; }

    /* A big "New Scan" button that appears after first scan to bring back the input row */
    #newScanBtn {
      display: none;
      margin-top: 12px;
      font-size: 24px;
      padding: 12px 16px;
    }
  </style>
</head>

<body>
  <h1>Vinyl Scanner</h1>

  <!-- Input row: hidden after first successful scan/search -->
  <div class="row" id="inputRow">
    <input
      id="barcode"
      placeholder="Scan or type barcode…"
      inputmode="numeric"
      autocomplete="off"
    />
    <button id="go">Search</button>
  </div>

  <!-- After first scan, this button appears to allow another scan -->
  <button id="newScanBtn">Scan another record</button>

  <div id="status">Ready</div>

  <div class="card">
    <img id="cover" alt="Cover"/>

    <div style="flex:1;">
      <div id="title"></div>
      <div id="artist" class="meta"></div>
      <div id="year" class="meta"></div>
      <div id="label" class="meta"></div>

      <!-- Track listing -->
      <div class="tracks">
        <h2>Track listing</h2>
        <div id="tracks" class="tracks-box">
          <div style="opacity:.6;">No track listing yet</div>
        </div>
      </div>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);

  function escapeHtml(str) {
    return String(str)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function clearDisplay() {
    $("title").textContent = "";
    $("artist").textContent = "";
    $("year").textContent = "";
    $("label").textContent = "";
    $("cover").src = "";
    $("tracks").innerHTML = "<div style='opacity:.6;'>No track listing</div>";
  }

  function renderTracks(tracklist) {
    if (!Array.isArray(tracklist) || tracklist.length === 0) {
      $("tracks").innerHTML = "<div style='opacity:.6;'>No track listing found</div>";
      return;
    }

    const items = tracklist.map(t => {
      const pos = t.position ? `<span class="pos">${escapeHtml(t.position)}</span>` : "";
      const title = escapeHtml(t.title || "");
      const dur = t.duration ? `<span class="dur">(${escapeHtml(t.duration)})</span>` : "";
      return `<li>${pos}${title}${dur}</li>`;
    }).join("");

    $("tracks").innerHTML = `<ol>${items}</ol>`;
  }

  function hideInputAfterSuccess() {
    // Hide the scan textbox row
    $("inputRow").style.display = "none";
    // Show a big button to allow a new scan
    $("newScanBtn").style.display = "inline-block";
  }

  function showInputForNewScan() {
    $("inputRow").style.display = "flex";
    $("newScanBtn").style.display = "none";
    $("barcode").value = "";
    $("barcode").focus();
    $("status").textContent = "Ready";
  }

  async function lookup() {
    const raw = $("barcode").value || "";
    const barcode = raw.replace(/\D/g, "");

    if (barcode.length < 10) {
      $("status").textContent = "Please enter a valid barcode (10+ digits)";
      return;
    }

    $("status").textContent = "Looking up…";
    clearDisplay();

    try {
      const res = await fetch(`/api/lookup?barcode=${encodeURIComponent(barcode)}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Lookup failed");

      $("status").textContent = data.cached ? "Ready (cached)" : "Ready";
      $("title").textContent = data.title || "";
      $("artist").textContent = (data.artists || []).join(" • ");
      $("year").textContent = data.year ? `Year: ${data.year}` : "";
      $("label").textContent =
        (data.labels && data.labels.length) ? `Label: ${data.labels[0]}` : "";

      if (data.cover) $("cover").src = data.cover;

      renderTracks(data.tracklist);

      // Remove scan text box after initial successful scan/search
      hideInputAfterSuccess();

    } catch (e) {
      $("status").textContent = "Error: " + e.message;
    }
  }

  $("go").addEventListener("click", lookup);
  $("barcode").addEventListener("keydown", (e) => {
    if (e.key === "Enter") lookup();
  });

  $("newScanBtn").addEventListener("click", showInputForNewScan);

  // Keep focus for scanner when input is visible
  window.addEventListener("click", () => {
    if ($("inputRow").style.display !== "none") $("barcode").focus();
  });

  $("barcode").focus();
</script>

</body>
</html>
