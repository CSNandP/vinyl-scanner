<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=800, height=480, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <title>Now Spinning</title>

  <style>
    :root{
      --bg:#ffffff; --fg:#111111;
      --muted: rgba(0,0,0,0.70);

      --wash: rgba(0,0,0,0.00);
      --wash2: rgba(0,0,0,0.00);
      --title: #111111;

      --shadow: rgba(0,0,0,0.16);
      --shadow2: rgba(0,0,0,0.08);
    }

    body{
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin:0;
      padding:12px 12px 10px 12px;
      color: var(--fg);
      background:
        radial-gradient(520px 520px at 210px 210px, var(--wash), rgba(0,0,0,0) 70%),
        radial-gradient(680px 680px at 260px 250px, var(--wash2), rgba(0,0,0,0) 76%),
        linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 52%, rgba(0,0,0,0.02) 100%),
        var(--bg);
      transition: background 0.7s ease, color 0.7s ease;
      overflow: hidden;
    }

    /* ---------- SPLASH ---------- */
    .splash {
      position: fixed;
      inset: 0;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 1;
      transition: opacity 0.7s ease;
      overflow: hidden;
    }
    .splash.hidden { opacity: 0; pointer-events: none; }

    .splash::before{
      content:"";
      position:absolute;
      inset:-40px;
      background:
        repeating-radial-gradient(circle at 50% 52%,
          rgba(255,255,255,0.075) 0px,
          rgba(255,255,255,0.075) 1px,
          rgba(255,255,255,0.00) 3px,
          rgba(255,255,255,0.00) 8px),
        radial-gradient(700px 520px at 52% 44%,
          rgba(255,255,255,0.08) 0%,
          rgba(255,255,255,0.00) 60%);
      opacity: 0.22;
      filter: blur(0.2px);
      transform-origin: 50% 52%;
      animation: grooveRotate 20s linear infinite;
    }

    .splash::after{
      content:"";
      position:absolute;
      inset:-40px;
      background:
        linear-gradient(110deg,
          rgba(255,255,255,0.00) 0%,
          rgba(255,255,255,0.06) 45%,
          rgba(255,255,255,0.00) 60%);
      opacity: 0.20;
      transform: translateX(-40%);
      animation: shimmer 6.8s ease-in-out infinite;
      mix-blend-mode: screen;
      pointer-events: none;
    }

    @keyframes grooveRotate { from{transform:rotate(0deg)} to{transform:rotate(360deg)} }
    @keyframes shimmer {
      0%,100% { transform: translateX(-55%) translateY(0); opacity: 0.12; }
      50%     { transform: translateX(25%) translateY(-6px); opacity: 0.22; }
    }

    .splash-inner{
      position: relative;
      z-index: 1;
      display:flex;
      flex-direction:column;
      align-items:center;
      justify-content:center;
      padding: 0 16px;
      text-align:center;
    }

    .splash-title-wrap{
      height: 62px;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
    }

    .splash-title {
      font-size: 52px;
      letter-spacing: 1.2px;
      color: rgba(255,255,255,0.95);
      text-transform: uppercase;
      margin: 0;
      line-height: 1.0;
      animation: breathe 2.8s ease-in-out infinite;
      will-change: transform, opacity;
      transform: translateY(0);
      opacity: 1;
      transition: opacity 0.55s ease, transform 0.55s ease;
      white-space: nowrap;
      user-select: none;
    }

    .splash-title.out { opacity: 0; transform: translateY(-10px); }
    .splash-title.in  { opacity: 1; transform: translateY(0); }

    .splash-title.code {
      letter-spacing: 2.2px;
      font-variant-numeric: tabular-nums;
      text-transform: none;
      animation: none;
    }

    .splash-sub {
      margin-top: 18px;
      font-size: 13px;
      letter-spacing: 1.6px;
      text-transform: uppercase;
      color: rgba(255,255,255,0.55);
      opacity: 0.9;
      user-select: none;
    }

    @keyframes breathe {
      0%, 100% { transform: translateY(0); opacity: 0.92; }
      50%      { transform: translateY(-2px); opacity: 1.00; }
    }

    /* ---------- LAYOUT ---------- */
    .frame{
      display:flex;
      flex-direction:column;
      height: calc(480px - 22px);
    }

    .topline{
      height: 16px;
      display:flex;
      align-items:center;
      justify-content:flex-end;
      padding-right: 2px;
    }

    #status{
      font-size: 11.5px;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0.65;
      user-select:none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 55vw;
    }

    .content{
      display:flex;
      gap:14px;
      align-items:flex-start;
      flex: 1 1 auto;
      min-height: 0;
    }

    /* ---------- RECORD PLAYER ---------- */
    .platter{
      position:relative;
      width:392px;
      height:392px;
      border-radius:50%;
      flex: 0 0 auto;
    }

    .platter::before{
      content:"";
      position:absolute;
      inset:-12px;
      border-radius:50%;
      background:
        radial-gradient(circle,
          rgba(0,0,0,0.16) 0%,
          rgba(0,0,0,0.10) 38%,
          rgba(0,0,0,0.04) 58%,
          rgba(0,0,0,0.00) 74%);
      filter: blur(9px);
      z-index:0;
      opacity: 0.95;
      transition: opacity 0.7s ease;
    }

    #cover{
      position:relative;
      z-index:1;
      width:392px;
      height:392px;
      border-radius:50%;
      object-fit:cover;
      background:#eee;
      box-shadow: 0 12px 30px var(--shadow);
      animation: spin 28s linear infinite;
      animation-play-state: paused;
      opacity: 0;
      transform: translateY(6px) scale(0.985);
      transition: opacity 0.35s ease, transform 0.35s ease;
      will-change: transform, opacity;
    }

    #cover.show{ opacity: 1; transform: translateY(0) scale(1); }

    .label-ring{
      position:absolute;
      inset:0;
      margin:auto;
      width: 96px;
      height: 96px;
      border-radius:50%;
      background:
        radial-gradient(circle,
          rgba(255,255,255,0.00) 0%,
          rgba(255,255,255,0.00) 58%,
          rgba(255,255,255,0.28) 60%,
          rgba(255,255,255,0.00) 66%);
      pointer-events:none;
      z-index:2;
      opacity: 0.9;
    }

    @keyframes spin{ from{transform:rotate(0deg)} to{transform:rotate(360deg)} }

    /* ---------- RIGHT SIDE ---------- */
    .rightSide{
      width:372px;
      min-width:0;
      height:392px;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      padding: 2px 2px 2px 2px;
      box-sizing:border-box;
    }

    .albumHeader{
      padding: 6px 2px 8px 2px;
    }

    .fade{ opacity:0; transform: translateY(6px); will-change: transform, opacity; }
    .fade.show{ opacity:1; transform: translateY(0); transition: opacity 0.35s ease, transform 0.35s ease; }

    #title{
      font-size: 22px;
      font-weight: 900;
      line-height: 1.06;
      letter-spacing: -0.4px;
      color: var(--title);
      transition: color 0.7s ease;
    }

    #artist{
      font-size: 15px;
      margin-top: 8px;
      font-weight: 900;
      opacity: 0.95;
      letter-spacing: -0.1px;
    }

    .metaRow{
      margin-top: 7px;
      display:flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items:center;
    }

    .metaChip{
      font-size: 11.5px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0.74;
      padding: 2px 0;
      white-space: nowrap;
    }

    /* QUOTE HERO AREA */
    .quoteHero{
      flex: 1 1 auto;
      min-height: 0;
      display:flex;
      flex-direction:column;
      justify-content:center;
      padding: 2px 0 0 0;
    }

    .quote{
      position: relative;
      font-family: Georgia, "Times New Roman", Times, serif;
      font-style: italic;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.12;
      letter-spacing: -0.25px;
      opacity: 0.98;

      /* Key: create predictable “safe margins” for quote marks */
      padding: 18px 22px 18px 26px;

      min-height: 230px;
      transform-origin: 30% 55%;
    }

    /* breathing: extremely subtle */
    @keyframes quoteBreathe {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.98; }
      50%      { transform: translateY(-1px) scale(1.008); opacity: 1; }
    }

    /* The marks: closer and anchored to the quote’s padding */
    .quote::before,
    .quote::after{
      position:absolute;
      font-style: normal;
      font-size: 64px;
      font-weight: 900;
      line-height: 1;
      color: var(--title);
      opacity: 0.22;
      pointer-events:none;
    }

    .quote::before{
      content: "“";
      left: 2px;         /* sits inside the padding area */
      top: -6px;
    }
    .quote::after{
      content: "”";
      right: 6px;        /* sits inside the padding area */
      bottom: -22px;
    }

    /* Fade/slide for rotations */
    .quoteFade{
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.75s ease, transform 0.75s ease;
    }
    .quoteFade.show{
      opacity: 1;
      transform: translateY(0);
      animation: quoteBreathe 8.5s ease-in-out infinite;
    }

    .source{
      margin-top: 6px;
      font-size: 11.5px;
      letter-spacing: 2.0px;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0.62;
      display:flex;
      justify-content:flex-end;
      user-select:none;
      padding-right: 2px;
    }

    /* ---------- FOOTER ---------- */
    .footer{
      height: 22px;
      display:flex;
      align-items:flex-end;
      justify-content:space-between;
      font-size: 12px;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0.78;
      user-select:none;
      padding: 0 2px;
    }

    .footer .center{
      flex: 1 1 auto;
      text-align:center;
      pointer-events:none;
    }

    .back{
      font-size: 11.5px;
      letter-spacing: 1.1px;
      text-transform: uppercase;
      color: var(--muted);
      opacity: 0.85;
      background: transparent;
      border: 1px solid rgba(0,0,0,0.0);
      padding: 2px 8px;
      border-radius: 999px;
      cursor: pointer;
      transition: opacity 0.2s ease, border-color 0.25s ease, background 0.25s ease;
    }

    .back:hover{
      opacity: 1;
      border-color: rgba(0,0,0,0.14);
      background: rgba(0,0,0,0.03);
    }
  </style>
</head>

<body>
  <!-- Splash overlay -->
  <div id="splash" class="splash">
    <div class="splash-inner">
      <div class="splash-title-wrap">
        <div id="splashTitle" class="splash-title in">Scan Record</div>
      </div>
      <div id="splashSub" class="splash-sub">Ready</div>
    </div>
  </div>

  <div class="frame">
    <div class="topline">
      <div id="status">Ready for scan…</div>
    </div>

    <div class="content">
      <div class="platter">
        <img id="cover" alt="Cover"/>
        <div class="label-ring"></div>
      </div>

      <div class="rightSide">
        <div class="albumHeader">
          <div id="title" class="fade"></div>
          <div id="artist" class="fade"></div>
          <div class="metaRow">
            <div id="year" class="metaChip fade"></div>
            <div id="label" class="metaChip fade"></div>
          </div>
        </div>

        <div class="quoteHero">
          <div id="quote" class="quote quoteFade">Scan a record to begin.</div>
          <div id="source" class="source">Source —</div>
        </div>
      </div>
    </div>

    <div class="footer">
      <button id="backBtn" class="back" type="button">Back to splash</button>
      <div class="center">Now Spinning</div>
      <div style="width:120px;"></div>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);

  const GAP_RESET_MS = 250;
  const SUBMIT_AFTER_MS = 180;

  let buffer = "";
  let lastKeyTime = 0;
  let submitTimer = null;

  // -------- Fact rotation --------
  let factItems = [];      // [{text, source}]
  let factIndex = 0;
  let factTimer = null;
  const FACT_ROTATE_MS = 6500;

  function stopFactRotation(){
    if (factTimer) clearInterval(factTimer);
    factTimer = null;
  }

  function startFactRotation(){
    stopFactRotation();
    if (!factItems || factItems.length <= 1) return;
    factTimer = setInterval(() => {
      factIndex = (factIndex + 1) % factItems.length;
      showFact(factIndex, true);
    }, FACT_ROTATE_MS);
  }

  function setQuote(text, source, animate){
    const quoteEl = $("quote");
    const srcEl = $("source");
    if (!quoteEl || !srcEl) return;

    if (animate) {
      quoteEl.classList.remove("show");
      setTimeout(() => {
        quoteEl.textContent = text || "";
        srcEl.textContent = source ? `Source — ${source}` : "Source —";
        quoteEl.classList.add("show");
      }, 240);
    } else {
      quoteEl.textContent = text || "";
      srcEl.textContent = source ? `Source — ${source}` : "Source —";
      quoteEl.classList.add("show");
    }
  }

  function showFact(i, animate){
    if (!factItems.length) {
      setQuote("No facts available yet.", "—", animate);
      return;
    }
    const item = factItems[i] || factItems[0];
    setQuote(item.text, item.source, animate);
  }

  // --- Splash (unchanged) ---
  const fontCycle = [
    'system-ui, -apple-system, Segoe UI, Roboto, sans-serif',
    '"Trebuchet MS", system-ui, sans-serif',
    '"Arial Black", Arial, system-ui, sans-serif',
    'Georgia, "Times New Roman", serif',
    '"Palatino Linotype", Palatino, serif',
    '"Courier New", Courier, monospace',
    '"Gill Sans", "Segoe UI", system-ui, sans-serif',
    'Impact, "Arial Black", system-ui, sans-serif'
  ];

  let fontIdx = 0;
  let fontTimer = null;
  let fontBusy = false;
  let splashMode = "idle"; // idle | code | lookup

  const getSplash = () => document.getElementById("splash");
  const getSplashTitle = () => document.getElementById("splashTitle");
  const getSplashSub = () => document.getElementById("splashSub");

  function safeStartSplashIdleFonts(){
    const st = getSplashTitle();
    if (!st) return;
    splashMode = "idle";
    st.classList.remove("code");
    st.style.fontFamily = fontCycle[0];
    st.textContent = "Scan Record";
    const ss = getSplashSub();
    if (ss) ss.textContent = "Ready";

    if (fontTimer) clearInterval(fontTimer);
    fontTimer = setInterval(async () => {
      const st2 = getSplashTitle();
      if (!st2) return;
      if (fontBusy) return;
      if (splashMode !== "idle") return;
      fontBusy = true;

      st2.classList.add("out");
      st2.classList.remove("in");
      await new Promise(r => setTimeout(r, 320));

      fontIdx = (fontIdx + 1) % fontCycle.length;
      st2.style.fontFamily = fontCycle[fontIdx];

      st2.classList.remove("out");
      st2.classList.add("in");
      await new Promise(r => setTimeout(r, 320));

      fontBusy = false;
    }, 1400);
  }

  function safeSetSplashBarcodeLive(digits){
    const st = getSplashTitle();
    if (!st) return;
    splashMode = "code";
    st.classList.add("code");
    st.style.fontFamily = '"Courier New", Courier, monospace';
    st.textContent = digits || "";
    const ss = getSplashSub();
    if (ss) ss.textContent = "Scanning…";
  }

  function safeSetSplashLookingUp(){
    const st = getSplashTitle();
    if (!st) return;
    splashMode = "lookup";
    st.classList.remove("code");
    st.style.fontFamily = 'system-ui, -apple-system, Segoe UI, Roboto, sans-serif';
    st.textContent = "Looking up…";
    const ss = getSplashSub();
    if (ss) ss.textContent = "Please wait";
  }

  function safeHideSplashOnce(){
    const sp = getSplash();
    if (!sp) return;
    if (sessionStorage.getItem("started") === "1") return;

    sessionStorage.setItem("started", "1");
    sp.classList.add("hidden");
    setTimeout(() => sp.remove(), 900);

    if (fontTimer) clearInterval(fontTimer);
  }

  function showSplashAgain(){
    sessionStorage.removeItem("started");

    if (!document.getElementById("splash")) {
      const div = document.createElement("div");
      div.id = "splash";
      div.className = "splash";
      div.innerHTML = `
        <div class="splash-inner">
          <div class="splash-title-wrap">
            <div id="splashTitle" class="splash-title in">Scan Record</div>
          </div>
          <div id="splashSub" class="splash-sub">Ready</div>
        </div>`;
      document.body.prepend(div);
    }

    document.getElementById("splash").classList.remove("hidden");
    safeStartSplashIdleFonts();
  }

  if (sessionStorage.getItem("started") === "1") {
    const sp = getSplash();
    if (sp) sp.remove();
  } else {
    safeStartSplashIdleFonts();
  }

  function setStatus(text){
    const el = $("status");
    if (el) el.textContent = text;
  }

  function clearReveal() {
    const cover = $("cover");
    cover.classList.remove("show");
    cover.style.animationPlayState = "paused";

    const fades = document.querySelectorAll(".fade");
    for (const el of fades) el.classList.remove("show");
  }

  function clearDisplay(keepStatus) {
    $("title").textContent = "";
    $("artist").textContent = "";
    $("year").textContent = "";
    $("label").textContent = "";
    $("cover").src = "";

    stopFactRotation();
    factItems = [];
    factIndex = 0;
    setQuote("Scan a record to begin.", "—", false);

    if (!keepStatus) setStatus("Ready for scan…");

    document.documentElement.style.setProperty("--wash", "rgba(0,0,0,0)");
    document.documentElement.style.setProperty("--wash2", "rgba(0,0,0,0)");
    document.documentElement.style.setProperty("--title", "var(--fg)");
  }

  function stageReveal() {
    $("cover").classList.add("show");

    const steps = [
      { el: $("title"), ms: 90 },
      { el: $("artist"), ms: 140 },
      { el: $("year"), ms: 200 },
      { el: $("label"), ms: 240 },
      { el: $("quote"), ms: 280 },
      { el: $("source"), ms: 340 }
    ];

    for (const s of steps) {
      setTimeout(() => {
        if (s.el) s.el.classList.add("show");
      }, s.ms);
    }
  }

  function applyThemeFromCover(img) {
    try {
      const c = document.createElement("canvas");
      const ctx = c.getContext("2d", { willReadFrequently: true });
      c.width = c.height = 56;
      ctx.drawImage(img, 0, 0, 56, 56);
      const d = ctx.getImageData(0, 0, 56, 56).data;

      let r=0,g=0,b=0,l=0,n=0;

      for (let i=0;i<d.length;i+=4) {
        if (d[i+3] < 200) continue;
        const max=Math.max(d[i],d[i+1],d[i+2]);
        const min=Math.min(d[i],d[i+1],d[i+2]);
        if (max>245 && min>245) continue;
        if (max<18 && min<18) continue;

        r+=d[i]; g+=d[i+1]; b+=d[i+2];
        l+=0.2126*d[i]+0.7152*d[i+1]+0.0722*d[i+2];
        n++;
      }
      if (!n) return;

      r=Math.round(r/n); g=Math.round(g/n); b=Math.round(b/n);

      const avg=(r+g+b)/3, boost=1.22;
      r=Math.min(255, Math.max(0, Math.round(avg+(r-avg)*boost)));
      g=Math.min(255, Math.max(0, Math.round(avg+(g-avg)*boost)));
      b=Math.min(255, Math.max(0, Math.round(avg+(b-avg)*boost)));

      document.documentElement.style.setProperty("--title", `rgb(${r},${g},${b})`);
      document.documentElement.style.setProperty("--wash",  `rgba(${r},${g},${b},0.18)`);
      document.documentElement.style.setProperty("--wash2", `rgba(${r},${g},${b},0.10)`);

      // keep background fixed to your preference (if you want auto-dark back, say so)
      document.documentElement.style.setProperty("--bg", "#ffffff");
      document.documentElement.style.setProperty("--fg", "#111111");
      document.documentElement.style.setProperty("--muted", "rgba(0,0,0,0.70)");
    } catch {}
  }

  function normalizeFacts(data){
    const raw = data && data.facts ? data.facts : [];
    const out = [];
    for (const f of (Array.isArray(raw) ? raw : [])) {
      if (typeof f === "string") out.push({ text: f, source: "—" });
      else if (f && typeof f.text === "string") out.push({ text: f.text, source: f.source || "—" });
    }
    return out.filter(x => x.text && x.text.trim());
  }

  async function lookup(code) {
    if (!code || code.length < 10) return;

    safeSetSplashLookingUp();
    safeHideSplashOnce();

    setStatus("Looking up…");
    clearReveal();
    clearDisplay(true);

    try {
      const res = await fetch(`/api/lookup?barcode=${code}`);
      const data = await res.json();
      if (!res.ok) throw new Error("Lookup failed");

      $("title").textContent = data.title || "";
      $("artist").textContent = (data.artists||[]).join(" • ");
      $("year").textContent = data.year ? `Year ${data.year}` : "";
      $("label").textContent = (data.labels||[]).length ? `${data.labels[0]}` : "";

      factItems = normalizeFacts(data);
      factIndex = 0;
      showFact(0, false);
      startFactRotation();

      if (data.cover) {
        const img = $("cover");
        img.crossOrigin = "anonymous";
        img.onload = () => {
          applyThemeFromCover(img);
          img.style.animationPlayState = "running";
          stageReveal();
        };
        img.onerror = () => stageReveal();
        img.src = data.cover; // /api/image?url=...
      } else {
        stageReveal();
      }

      setStatus(data.cached ? "Loaded (cached) — ready" : "Loaded — ready");
    } catch (e) {
      setStatus("Error — ready for scan…");
    }
  }

  function scheduleSubmit() {
    clearTimeout(submitTimer);
    submitTimer = setTimeout(() => {
      const digits = buffer.replace(/\D/g,"");
      buffer = "";
      if (digits.length >= 10) lookup(digits);
      else if (sessionStorage.getItem("started") !== "1") safeStartSplashIdleFonts();
    }, SUBMIT_AFTER_MS);
  }

  window.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;

    const now = Date.now();
    if (now - lastKeyTime > GAP_RESET_MS) buffer = "";
    lastKeyTime = now;

    if (e.key === "Enter") {
      const digits = buffer.replace(/\D/g,"");
      buffer = "";
      if (digits.length >= 10) lookup(digits);
      else if (sessionStorage.getItem("started") !== "1") safeStartSplashIdleFonts();
      return;
    }

    if (/[0-9]/.test(e.key)) {
      if (sessionStorage.getItem("started") !== "1") {
        const digits = (buffer + e.key).replace(/\D/g,"");
        safeSetSplashBarcodeLive(digits);
      }
      buffer += e.key;
      scheduleSubmit();
    }
  }, true);

  $("backBtn").addEventListener("click", () => {
    if (submitTimer) clearTimeout(submitTimer);
    buffer = "";

    stopFactRotation();
    clearReveal();
    clearDisplay(false);
    setStatus("Ready for scan…");

    const cover = $("cover");
    cover.style.animationPlayState = "paused";
    cover.classList.remove("show");

    showSplashAgain();
    safeStartSplashIdleFonts();
  });

  // initial state
  clearReveal();
  clearDisplay(false);
</script>

</body>
</html>
