<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=800, height=480, initial-scale=1, maximum-scale=1, user-scalable=no"/>
  <title>Vinyl Scanner</title>

  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 14px; }
    h1 { margin: 0 0 8px 0; font-size: 22px; }
    #status { font-size: 16px; margin: 6px 0 10px 0; opacity: 0.9; }

    .card { display: flex; gap: 14px; align-items: flex-start; }
    #cover {
      width: 320px;
      height: 320px;
      object-fit: cover;
      background: #eee;
      border-radius: 12px;
    }

    #title { font-size: 26px; font-weight: 800; line-height: 1.1; }
    .meta { font-size: 16px; margin-top: 6px; opacity: 0.95; }

    .tracks { margin-top: 10px; }
    .tracks h2 { font-size: 16px; margin: 0 0 6px 0; font-weight: 800; }

    .tracks-box {
      border: 1px solid #ddd;
      border-radius: 12px;
      padding: 8px 10px;
      background: #fafafa;
      max-height: 190px;
      overflow: auto;
    }
    .tracks-box ol { margin: 0; padding-left: 20px; }
    .tracks-box li { font-size: 14px; margin: 5px 0; }
    .pos { font-weight: 800; margin-right: 6px; }
    .dur { opacity: 0.7; margin-left: 6px; }

    /* Tiny debug line (helps confirm scans are being captured) */
    #debug {
      font-size: 12px;
      opacity: 0.55;
      margin-top: 6px;
      user-select: none;
    }
  </style>
</head>

<body>
  <h1>Vinyl Scanner</h1>
  <div id="status">Ready for scan…</div>

  <div class="card">
    <img id="cover" alt="Cover"/>

    <div style="flex:1;">
      <div id="title"></div>
      <div id="artist" class="meta"></div>
      <div id="year" class="meta"></div>
      <div id="label" class="meta"></div>

      <div class="tracks">
        <h2>Track listing</h2>
        <div id="tracks" class="tracks-box">
          <div style="opacity:.6;">Scan a record to show tracks</div>
        </div>
      </div>

      <div id="debug"></div>
    </div>
  </div>

<script>
  const $ = (id) => document.getElementById(id);

  // If you want it to clear automatically after showing a record, set a value (ms)
  const AUTO_CLEAR_MS = 0;

  // Scanner “typing speed” tuning:
  // - if gap between keys is > 250ms, we treat it as a new scan starting
  // - we auto-submit 180ms after last digit
  const GAP_RESET_MS = 250;
  const SUBMIT_AFTER_MS = 180;

  let buffer = "";
  let lastKeyTime = 0;
  let submitTimer = null;
  let clearTimer = null;

  function escapeHtml(str) {
    return String(str)
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");
  }

  function clearDisplay(keepStatus) {
    $("title").textContent = "";
    $("artist").textContent = "";
    $("year").textContent = "";
    $("label").textContent = "";
    $("cover").src = "";
    $("tracks").innerHTML = "<div style='opacity:.6;'>Scan a record to show tracks</div>";
    if (!keepStatus) $("status").textContent = "Ready for scan…";
  }

  function renderTracks(tracklist) {
    if (!Array.isArray(tracklist) || tracklist.length === 0) {
      $("tracks").innerHTML = "<div style='opacity:.6;'>No track listing found</div>";
      return;
    }

    const items = tracklist.map(t => {
      const pos = t.position ? `<span class="pos">${escapeHtml(t.position)}</span>` : "";
      const title = escapeHtml(t.title || "");
      const dur = t.duration ? `<span class="dur">(${escapeHtml(t.duration)})</span>` : "";
      return `<li>${pos}${title}${dur}</li>`;
    }).join("");

    $("tracks").innerHTML = `<ol>${items}</ol>`;
  }

  async function lookup(barcode) {
    if (!barcode || barcode.length < 10) {
      $("status").textContent = "Scan error: barcode too short — ready for scan…";
      return;
    }

    if (clearTimer) { clearTimeout(clearTimer); clearTimer = null; }

    $("status").textContent = `Looking up ${barcode}…`;
    clearDisplay(true);

    try {
      const res = await fetch(`/api/lookup?barcode=${encodeURIComponent(barcode)}`);
      const data = await res.json();
      if (!res.ok) throw new Error(data.error || "Lookup failed");

      $("status").textContent = data.cached ? "Loaded (cached) — ready for scan…" : "Loaded — ready for scan…";
      $("title").textContent = data.title || "";
      $("artist").textContent = (data.artists || []).join(" • ");
      $("year").textContent = data.year ? `Year: ${data.year}` : "";
      $("label").textContent = (data.labels && data.labels.length) ? `Label: ${data.labels[0]}` : "";
      if (data.cover) $("cover").src = data.cover;
      renderTracks(data.tracklist);

      if (AUTO_CLEAR_MS > 0) {
        clearTimer = setTimeout(() => clearDisplay(false), AUTO_CLEAR_MS);
      }
    } catch (e) {
      $("status").textContent = "Error: " + e.message + " — ready for scan…";
    }
  }

  function scheduleSubmit() {
    if (submitTimer) clearTimeout(submitTimer);
    submitTimer = setTimeout(() => {
      const barcode = buffer.replace(/\D/g, "");
      buffer = "";
      $("debug").textContent = "";
      if (barcode.length >= 10) lookup(barcode);
    }, SUBMIT_AFTER_MS);
  }

  function onAnyKey(e) {
    // ignore modifier combos
    if (e.ctrlKey || e.metaKey || e.altKey) return;

    const now = Date.now();

    // If there was a gap, start a fresh buffer
    if (now - lastKeyTime > GAP_RESET_MS) buffer = "";
    lastKeyTime = now;

    if (e.key === "Enter") {
      // Some scanners send Enter: submit immediately
      const barcode = buffer.replace(/\D/g, "");
      buffer = "";
      $("debug").textContent = "";
      if (barcode.length >= 10) lookup(barcode);
      return;
    }

    // accept digits only
    if (e.key.length === 1 && /[0-9]/.test(e.key)) {
      buffer += e.key;
      $("debug").textContent = "Scan captured: " + buffer;
      scheduleSubmit();
    }
  }

  // Capture keystrokes anywhere (touch-free)
  window.addEventListener("keydown", onAnyKey, true);

  // Start ready
  clearDisplay(false);
</script>

</body>
</html>
